<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature | Technician</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#202326;--muted:#697078;--line:#dfe2e6;--green:#356b45;--red:#a52a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px Arial,Helvetica,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:9px max(16px,calc((100vw - 850px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:19px;font-weight:800;letter-spacing:.7px}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.user{font-size:12px;text-align:right;color:var(--muted)}main{max-width:850px;margin:0 auto;padding:8px 16px 90px}
.title{font-size:23px;margin:2px 0 6px}
.sub{color:var(--muted);margin:5px 0 20px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin-bottom:5px}
.tab{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:11px 14px;border-radius:7px}
.tab.active,.dark{background:#222;color:#fff;border-color:#222}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px;margin:12px 0}
.card h2{font-size:18px;margin:5px 0 12px}
.meta{color:var(--muted);font-size:13px;line-height:1.7}
.pill{font-size:11px;border-radius:4px;padding:5px 7px;background:#edf0f2;display:inline-block;margin:3px 5px 5px 0;text-transform:capitalize}
.released{background:#e5efe7;color:var(--green)}
.team-members{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.team-member{padding:7px 10px;background:#edf0f2;border-radius:6px;font-size:13px}.team-member.self{background:#e5efe7;color:var(--green);font-weight:bold}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:11px 14px;min-height:43px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.dark{background:#222;color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.btn.danger{color:var(--red)}
.section{margin:20px 0}
.section h3{font-size:16px;margin:0 0 10px}
.field{margin:12px 0}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cfd3d7;border-radius:6px;background:white}textarea{min-height:95px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{padding:12px 0;border-bottom:1px solid #eceef0;overflow-wrap:anywhere}
.item:last-child{border:0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.back{margin-bottom:15px}
.notice{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.error{color:var(--red)}
.thumb{width:110px;height:85px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:7px;padding:13px 18px;display:none;z-index:9;max-width:90vw}#toast.bad{background:var(--red)}
@media(max-width:550px){.grid{grid-template-columns:1fr}
.actions .btn{flex:1}
.user{max-width:135px;overflow-wrap:anywhere}
.card{padding:14px}main{padding:8px 12px 80px}}

.part-result{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);padding:12px;border-radius:6px;margin:5px 0}
.part-result:hover,.part-result:focus{background:#f1f3f5}
.part-result small{display:block;color:var(--muted);margin-top:4px}
.part-picker{border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px}
.part-picker .grid{margin-top:8px}
</style></head><body>
<header><div class="brand">SIGNATURE<small>TECHNICIAN PORTAL</small></div><div class="user"><div id="who">Signing in...</div><button class="btn" id="signout" style="margin-top:6px;padding:6px 10px;min-height:30px">Sign Out</button></div></header>
<main><div id="app" class="empty">Loading your schedule...</div></main><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SUPABASE_URL='https://zpawrfdfutswbvhlwvqf.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_NGa3aWmkMCXm45Hf4m-RYQ_QitmMq68';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let profile=null,tech=null,orders=[],blocks=[],requests=[],tab='schedule',selected=null,selectedBlock=null,busy=false,teamMap={},blockTeamMap={};
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const contactName=c=>[c?.first_name,c?.last_name].filter(Boolean).join(' ').trim();
const name=c=>c?.company_name||contactName(c)||'Customer';
const customerLines=c=>[c?.company_name,contactName(c)].filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join('');
const preview=(x,max=110)=>{const t=String(x||'').replace(/\s+/g,' ').trim();return t.length>max?t.slice(0,max-1).trimEnd()+'…':t};
const date=x=>x?new Date(x).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Not scheduled';
const label=x=>String(x||'open').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const wo=x=>x.work_order_number==null?'Work Order':`WO-${String(x.work_order_number).padStart(6,'0')}`;
const teamFor=o=>teamMap[o.id]||[];
const isLead=o=>{const team=teamFor(o);return team.length===1?team[0].technician_id===tech.id:team.length>1&&o.lead_technician_id===tech.id};
const isQuoted=o=>o.billing_method==='quoted';
const address=x=>[x?.address,x?.city,x?.state,x?.zip].filter(Boolean).join(', ');
function toast(s,bad=false){const t=document.getElementById('toast');t.textContent=s;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4800)}
function fail(e){console.error(e);toast(e?.message||String(e),true)}
function btn(id,text,klass=''){return `<button class="btn ${klass}" data-act="${id}">${esc(text)}</button>`}
async function init(){try{const {data:{session},error:e}=await db.auth.getSession();if(e)throw e;if(!session){location.replace('login.html');return}const {data:u,error:ue}=await db.from('users').select('id,first_name,last_name,role,active').eq('auth_user_id',session.user.id).single();if(ue)throw ue;if(u?.role!=='technician'||!u.active)throw Error('This page is for active technician accounts. Please sign in with a technician account.');profile=u;const {data:t,error:te}=await db.from('technicians').select('id,first_name,last_name,active').eq('user_id',u.id).single();if(te)throw te;if(!t?.active)throw Error('Technician profile is inactive.');tech=t;document.getElementById('who').textContent=[t.first_name,t.last_name].filter(Boolean).join(' ');await refresh()}catch(e){console.error(e);app.innerHTML=`<div class="notice error">${esc(e.message||'Unable to load account.')}</div>`}}
async function refresh(){
  // Assignments are now many-to-many: a work order may have several technicians.
  const {data:links,error:linkError}=await db.from('service_call_technicians')
    .select('service_call_id').eq('technician_id',tech.id);
  if(linkError){
    fail(linkError);
    app.innerHTML=`<div class="notice error">Unable to load technician assignments: ${esc(linkError.message)}</div>`;
    return;
  }
  const ids=[...new Set((links||[]).map(x=>x.service_call_id).filter(Boolean))];
  if(!ids.length){
    orders=[];
    if(selected){selected=null;toast('This work order is no longer available.');}
    await loadScheduleBlocks();
    await loadRequests();
    render();
    return;
  }
  const {data,error}=await db.from('service_calls')
    .select('id,work_order_number,work_type,status,priority,description,scheduled_at,started_at,completed_at,released,assigned_technician_id,billing_method,lead_technician_id,service_classification,labor_hours,labor_technician_count,trip_charge,customers(first_name,last_name,company_name,phone,email),locations(address,city,state,zip,notes)')
    .in('id',ids).eq('released',true)
    .order('scheduled_at',{ascending:true,nullsFirst:false});
  if(error){
    fail(error);
    app.innerHTML=`<div class="notice error">Unable to load work orders: ${esc(error.message)}</div>`;
    return;
  }
  orders=data||[];
  teamMap={};
  // Team names are supplied by a scoped server function, not a broad technician-table read.
  // Failure to retrieve teammates must never hide the work orders themselves.
  if(orders.length){
    const {data:teamRows,error:teamError}=await db.rpc('technician_work_order_team',{p_work_order_ids:orders.map(o=>o.id)});
    if(teamError){console.warn('Assigned team unavailable:',teamError.message)}
    else for(const member of teamRows||[]){
      if(!teamMap[member.service_call_id])teamMap[member.service_call_id]=[];
      teamMap[member.service_call_id].push(member);
    }
  }
  if(selected&&!orders.some(o=>o.id===selected)){
    selected=null;
    toast('This work order is no longer available.');
  }
  await loadScheduleBlocks();
  await loadRequests();
  if(selectedBlock&&!blocks.some(b=>b.id===selectedBlock))selectedBlock=null;
  render();
}

async function loadScheduleBlocks(){
  blocks=[];
  blockTeamMap={};
  try{
    const {data:links,error:le}=await db.from('schedule_block_technicians')
      .select('schedule_block_id').eq('technician_id',tech.id);
    if(le)throw le;
    const ids=[...new Set((links||[]).map(x=>x.schedule_block_id).filter(Boolean))];
    if(ids.length){
      const {data,error}=await db.from('schedule_blocks')
        .select('id,title,block_type,description,location,starts_at,ends_at,all_day,status,released')
        .in('id',ids).eq('status','approved').eq('released',true)
        .order('starts_at',{ascending:true});
      if(error)throw error;
      blocks=data||[];
      if(blocks.length){
        const {data:members,error:teamError}=await db.rpc('technician_schedule_block_team',{
          p_block_ids:blocks.map(b=>b.id)
        });
        if(teamError){
          console.warn('Schedule Block team unavailable:',teamError.message);
          toast('Assigned technician names could not be loaded. Check the Schedule Block team function.',true);
        }else{
          for(const member of members||[]){
            if(!blockTeamMap[member.schedule_block_id])blockTeamMap[member.schedule_block_id]=[];
            blockTeamMap[member.schedule_block_id].push(member);
          }
        }
      }
    }
  }catch(e){console.warn('Schedule blocks unavailable:',e);toast('Schedule blocks could not be loaded: '+e.message,true)}
}

async function loadRequests(){
  try{
    const {data,error}=await db.from('schedule_block_requests')
      .select('id,requested_by_user_id,request_type,title,block_type,description,location,proposed_starts_at,proposed_ends_at,proposed_all_day,reason,status,review_note,created_at,schedule_block_id')
      .eq('requested_by_user_id',profile.id).order('created_at',{ascending:false});
    if(error)throw error;
    requests=data||[];
  }catch(e){requests=[];console.warn(e);toast('Requests unavailable: '+e.message,true)}
}
function requestsView(){
 return `<h1 class="title">Work Orders</h1>
 <div class="actions">${btn('newRequest','+ New Request','dark')}${btn('refresh','↻ Refresh')}</div>
 ${requests.length?requests.map(r=>`<article class="card">
 <span class="pill">${esc(label(r.status))}</span><span class="pill">${esc(label(r.request_type))}</span>
 <h2>${esc(r.title||'Schedule Block Change')}</h2>
 <div class="meta">Submitted ${esc(date(r.created_at))}</div>
 ${r.proposed_starts_at?`<div class="meta">${esc(date(r.proposed_starts_at))} – ${esc(date(r.proposed_ends_at))}</div>`:''}
 ${r.reason?`<p>${esc(r.reason)}</p>`:''}
 ${r.review_note?`<p class="meta"><b>Dispatch response:</b> ${esc(r.review_note)}</p>`:''}
 ${r.status==='pending'?`<div class="actions">${btn('withdraw:'+r.id,'Withdraw Request','danger')}</div>`:''}
 </article>`).join(''):'<div class="empty">No schedule requests yet.</div>'}`;
}
function requestForm(b=null){
 const changing=!!b;
 const d=x=>{if(!x)return '';const z=new Date(x);const p=n=>String(n).padStart(2,'0');return `${z.getFullYear()}-${p(z.getMonth()+1)}-${p(z.getDate())}T${p(z.getHours())}:${p(z.getMinutes())}`};
 app.innerHTML=`<div class="back">${btn(changing?'backSchedule':'backRequests','← Back')}</div>
 <div class="card"><h1 class="title">${changing?'Request Schedule Change':'New Schedule Request'}</h1>
 <form id="scheduleRequestForm">
 ${changing?`<div class="field"><label>Request</label><select name="request_type" id="requestType"><option value="modify">Change this block</option><option value="cancel">Cancel this block</option></select></div>`:''}
 ${field('title','Title',b?.title||'', 'text',true)}
 <div class="grid">${field('starts_at','Start',d(b?.starts_at),'datetime-local',true)}${field('ends_at','End',d(b?.ends_at),'datetime-local',true)}</div>
 ${field('location','Location',b?.location||'')}
 ${area('description','Description',b?.description||'')}
 <div class="actions"><button class="btn dark" id="saveRequest" type="submit">Submit to Dispatch</button></div>
 </form></div>`;
 const sel=document.getElementById('requestType');
 if(sel)sel.onchange=()=>{const hide=sel.value==='cancel';for(const n of ['title','starts_at','ends_at','location','description']){const el=document.querySelector(`[name="${n}"]`);if(el){el.disabled=hide;if(el.closest('.field'))el.closest('.field').style.display=hide?'none':''}}};
 document.getElementById('scheduleRequestForm').onsubmit=async e=>{
  e.preventDefault();if(busy)return;
  const f=new FormData(e.target),cancel=changing&&f.get('request_type')==='cancel';
  const start=f.get('starts_at'),end=f.get('ends_at');
  if(!cancel&&(!start||!end||new Date(end)<=new Date(start)))return toast('End must be after start.',true);
  busy=true;document.getElementById('saveRequest').disabled=true;
  try{
   const args=changing?{
    p_block_id:b.id,p_request_type:cancel?'cancel':'modify',
    p_title:cancel?null:String(f.get('title')).trim(),p_block_type:cancel?null:(b.block_type||'other'),
    p_starts_at:cancel?null:new Date(start).toISOString(),
    p_ends_at:cancel?null:new Date(end).toISOString(),
    p_description:cancel?null:f.get('description'),p_location:cancel?null:f.get('location'),
    p_all_day:cancel?null:false,p_reason:(String(f.get('description')||'').trim()||String(f.get('title')||'').trim()||'Schedule change requested')
   }:{
    p_title:String(f.get('title')).trim(),p_block_type:'other',
    p_starts_at:new Date(start).toISOString(),p_ends_at:new Date(end).toISOString(),
    p_description:f.get('description'),p_location:f.get('location'),
    p_all_day:false,p_reason:(String(f.get('description')||'').trim()||String(f.get('title')||'').trim()||'Schedule change requested')
   };
   const {error}=await db.rpc(changing?'technician_request_schedule_change':'technician_submit_schedule_block',args);
   if(error)throw error;
   tab='requests';selected=null;await refresh();toast('Request submitted to Dispatch.');
  }catch(err){fail(err)}finally{busy=false;const el=document.getElementById('saveRequest');if(el)el.disabled=false}
 };
}
function blockTeamSection(b){
  const members=blockTeamMap[b.id]||[];
  if(!members.length)return '';
  return `<div class="section"><h3>ASSIGNED TECHNICIANS</h3>
    <div class="team-members">${members.map(m=>`<span class="team-member ${m.technician_id===tech.id?'self':''}">${esc(m.display_name)}${m.technician_id===tech.id?' (You)':''}</span>`).join('')}</div></div>`;
}

function blockCard(b){
 return `<article class="card"><span class="pill released">Schedule Block</span>
  <h2>${esc(b.title)}</h2>
  <div class="meta">${esc(date(b.starts_at))} – ${esc(date(b.ends_at))}</div>
  ${b.location?`<p class="meta">Location: ${esc(b.location)}</p>`:''}
  ${b.description?`<p>${esc(preview(b.description))}</p>`:''}
  ${blockTeamSection(b)}
  <div class="actions">${btn('openBlock:'+b.id,'Open Schedule Block','dark')}${btn('changeBlock:'+b.id,'Request Change / Cancel')}</div></article>`;
}
function blockDetail(b){
 app.innerHTML=`<div class="back">${btn('backBlock','← My Schedule')}</div>
 <div class="card"><span class="pill released">Schedule Block</span>
 <h1 class="title">${esc(b.title)}</h1>
 <div class="meta"><b>Start:</b> ${esc(date(b.starts_at))}</div>
 <div class="meta"><b>End:</b> ${esc(date(b.ends_at))}</div>
 ${b.all_day?'<div class="meta">All day</div>':''}
 ${b.location?`<div class="section"><h3>LOCATION</h3><p>${esc(b.location)}</p></div>`:''}
 ${b.description?`<div class="section"><h3>DESCRIPTION</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(b.description)}</p></div>`:''}
 ${blockTeamSection(b)}
 <div class="actions">${btn('changeBlock:'+b.id,'Request Change / Cancel')}</div></div>`;
}
function orderCard(o){
 return `<article class="card"><div class="meta"><b>${esc(wo(o))}</b>${o.scheduled_at?` · ${esc(date(o.scheduled_at))}`:''}</div>
 <span class="pill">${esc(label(o.status))}</span>
 <span class="pill">${esc(o.work_type==='checkout'?'Check-Out':o.work_type==='install'?'Installation':'Service')}</span>
 <h2>${esc(preview(o.description)||'Work Order')}</h2>
 <div class="meta">${customerLines(o.customers)}${address(o.locations)?`<div>${esc(address(o.locations))}</div>`:''}</div>
 <div class="actions">${btn('open:'+o.id,'Open Work Order','dark')}</div></article>`;
}
function topTabs(){
 const pending=requests.filter(r=>r.status==='pending').length;
 return `<div class="tabs">${[['schedule','My Schedule'],['current','Current'],['completed','Completed'],['requests',`My Requests${pending?' ('+pending+')':''}`]].map(([k,n])=>
 `<button class="tab ${tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('')}</div>`;
}
function filtered(){
 if(tab==='upcoming')return orders.filter(o=>['scheduled','open'].includes(o.status));
 if(tab==='current')return orders.filter(o=>o.status==='in_progress');
 return orders.filter(o=>o.status==='completed');
}
function scheduleItems(){
 const work=orders.filter(o=>['open','scheduled','in_progress'].includes(o.status)).map(o=>({kind:'work',date:o.scheduled_at||null,item:o}));
 const time=blocks.map(b=>({kind:'block',date:b.starts_at||null,item:b}));
 return [...work,...time].sort((a,b)=>{
  if(!a.date)return 1;if(!b.date)return -1;
  return new Date(a.date)-new Date(b.date);
 });
}
function render(){
 if(selected){const o=orders.find(x=>x.id===selected);if(o)return detail(o)}
 if(selectedBlock){const b=blocks.find(x=>x.id===selectedBlock);if(b)return blockDetail(b)}
 if(tab==='requests'){app.innerHTML=requestsView().replace('<div class="actions">',topTabs()+'<div class="actions">');return}
 if(tab==='schedule'){
  const items=scheduleItems();
  app.innerHTML=`<h1 class="title">Work Orders</h1>
  ${topTabs()}<div class="actions">${btn('refresh','↻ Refresh')}</div>
  ${items.length?items.map(x=>x.kind==='block'?blockCard(x.item):orderCard(x.item)).join(''):'<div class="empty">Nothing on your schedule yet.</div>'}`;
  return;
 }
 app.innerHTML=`<h1 class="title">Work Orders</h1>
 ${topTabs()}<div class="actions">${btn('refresh','↻ Refresh')}</div>
 ${filtered().length?filtered().map(orderCard).join(''):'<div class="empty">No work orders in this section.</div>'}`;
}
function teamSection(o){
  const members=teamMap[o.id]||[];
  if(members.length<2)return '';
  return `<div class="section"><h3>ASSIGNED TEAM</h3><div class="team-members">${members.map(m=>`<span class="team-member ${m.technician_id===tech.id?'self':''}">${esc(m.display_name)}${m.technician_id===tech.id?' (You)':''}${o.lead_technician_id===m.technician_id?' · Lead':''}</span>`).join('')}</div></div>`;
}
function detail(o){
 const lead=isLead(o);
 const tel=o.customers?.phone||'';
 const addr=address(o.locations);
 const map=addr?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr):'';
 app.innerHTML=`<div class="back">${btn('back','← My Schedule')}</div>
 <div class="card"><h1 class="title">${esc(wo(o))}</h1>
 <span class="pill">${esc(label(o.status))}</span><span class="pill">${isQuoted(o)?'Quoted':'Standard'}</span>${lead?'<span class="pill released">Lead Technician</span>':''}<span class="pill">${esc(o.work_type==='checkout'?'Check-Out':o.work_type==='install'?'Installation':'Service')}</span>
 ${customerLines(o.customers)||addr||tel?`<div class="section"><h3>CUSTOMER / LOCATION</h3>${customerLines(o.customers)}${addr?`<div class="meta">${esc(addr)}</div>`:''}
 <div class="actions">${tel?`<a class="btn" href="tel:${esc(tel.replace(/[^\d+]/g,''))}">☎ Call</a>`:''}${map?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(map)}">↗ Directions</a>`:''}</div></div>`:''}
 ${teamSection(o)}
 ${o.description?`<div class="section"><h3>WORK DESCRIPTION</h3><p>${esc(o.description)}</p></div>`:''}
 ${o.locations?.notes?`<p class="meta">Location notes: ${esc(o.locations.notes)}</p>`:''}
 <div class="actions">${['open','scheduled'].includes(o.status)?btn('status:in_progress','Start Work','dark'):''}
 ${o.status==='in_progress'?btn('status:scheduled','Return to My Schedule')+btn('complete',lead?'Complete Work Order':'Submit Completion Note','dark'):''}
 ${o.status==='completed'?btn('status:in_progress','Reopen Work Order'):''}</div></div>
 ${lead?`<div class="card"><div class="section"><h3>Parts</h3><div id="parts">Loading...</div>${btn('partForm','+ Add Part')}</div></div>`:''}
 <div class="card"><div class="section"><h3>Notes</h3><div id="notes">Loading...</div>${btn('noteForm','+ Add Note')}</div></div>
 <div class="card"><div class="section"><h3>Photos</h3><div id="photos">Loading...</div>${btn('photoForm','+ Add Photo')}</div></div>
 <div class="card"><div class="section"><h3>Status History</h3><div id="history">Loading...</div></div></div>`;
 loadRelated(o.id);
}
async function loadRelated(id){const order=orders.find(o=>o.id===id);const lead=!!order&&isLead(order);const results=await Promise.all([lead?db.from('parts').select('*').eq('service_call_id',id).order('created_at',{ascending:false}):Promise.resolve({data:[],error:null}),db.from('service_call_notes').select('*').eq('service_call_id',id).order('created_at',{ascending:false}),db.from('service_call_photos').select('*').eq('service_call_id',id).order('created_at',{ascending:false}),db.from('service_call_status_history').select('*').eq('service_call_id',id).order('created_at',{ascending:false})]);if(selected!==id)return;const [p,n,ph,h]=results;const target=k=>document.getElementById(k);const error=x=>`<div class="error">${esc(x.message)}</div>`;if(lead&&target('parts'))target('parts').innerHTML=p.error?error(p.error):(p.data.length?p.data.map(x=>`<div class="item"><b>${esc(x.part_number||x.description||'Part')}</b> · Qty ${esc(x.quantity??0)}${x.unit_cost!=null?` · Unit Price $${esc(Number(x.unit_price??x.unit_cost).toFixed(2))}`:""}${x.description&&x.part_number?`<div class="meta">${esc(x.description)}</div>`:''}<div class="actions">${btn('editPart:'+x.id,'Edit')}${btn('delPart:'+x.id,'Delete','danger')}</div></div>`).join(''):'<p class="meta">No parts recorded.</p>');target('notes').innerHTML=n.error?error(n.error):(n.data.length?n.data.map(x=>`<div class="item">${x.is_completion_note?'<span class="pill released">Completion Note</span>':''}<div>${esc(x.note)}</div><div class="meta">${esc(date(x.created_at))}</div>${!x.is_completion_note&&x.user_id===profile.id?`<div class="actions">${btn('editNote:'+x.id,'Edit')}${btn('delNote:'+x.id,'Delete','danger')}</div>`:''}</div>`).join(''):'<p class="meta">No notes recorded.</p>');target('history').innerHTML=h.error?error(h.error):(h.data.length?h.data.map(x=>`<div class="item"><b>${esc(label(x.status))}</b><div class="meta">${esc(date(x.created_at))}</div></div>`).join(''):'<p class="meta">No status changes recorded yet.</p>');if(ph.error){target('photos').innerHTML=error(ph.error)}else{const rows=await Promise.all(ph.data.map(async x=>{let pic='';if(x.file_path&&!/^https?:\/\//i.test(x.file_path)){const {data}=await db.storage.from('dispatch-photos').createSignedUrl(x.file_path,1800);pic=data?.signedUrl||''}return `<div class="item">${pic?`<a href="${esc(pic)}" target="_blank" rel="noopener noreferrer"><img class="thumb" src="${esc(pic)}" alt="Work order photo"></a>`:''}<div>${esc(x.caption||'Photo')}</div><div class="actions">${btn('delPhoto:'+x.id,'Delete Photo','danger')}</div></div>`}));if(selected===id)target('photos').innerHTML=rows.length?rows.join(''):'<p class="meta">No photos recorded.</p>'}}
function form(title,fields,action){app.innerHTML=`<div class="back">${btn('backDetail','← Back to Work Order')}</div><div class="card"><h1 class="title">${esc(title)}</h1><form id="editForm">${fields}<div class="actions"><button type="submit" class="btn dark" id="saveButton">Save</button><button type="button" class="btn" data-act="backDetail">Cancel</button></div></form></div>`;document.getElementById('editForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;const b=document.getElementById('saveButton');b.disabled=true;try{await action(new FormData(e.target));await refresh();toast('Saved.')}catch(err){fail(err)}finally{busy=false;if(b.isConnected)b.disabled=false}})}
function field(n,label,value='',type='text',required=false){return `<div class="field"><label for="f_${n}">${esc(label)}</label><input id="f_${n}" name="${n}" type="${type}" ${type==='number'?'step="'+(n==='unit_cost'?'0.01':'1')+'" min="0"':''} value="${esc(value)}" ${required?'required':''}></div>`}
function area(n,label,value='',required=false){return `<div class="field"><label for="f_${n}">${esc(label)}</label><textarea id="f_${n}" name="${n}" ${required?'required':''}>${esc(value)}</textarea></div>`}
async function getRow(table,id){const {data,error}=await db.from(table).select('*').eq('id',id).eq('service_call_id',selected).single();if(error)throw error;return data}
// Technician Parts shopping list: catalog lookup is hidden until the user types.
let partsCart=[], partsSearchSerial=0, partsResults=[], partsEditing=null, partsContextOrder=null;
const money=n=>'$'+Number(n||0).toFixed(2);
function partsAuthorized(){const o=orders.find(x=>x.id===selected);return !!o&&isLead(o)}
function partsCartRow(p,i){return `<div class="item"><b>${esc(p.name)}</b>${p.part_number?`<div class="meta">${esc(p.part_number)}</div>`:''}
 <div class="grid"><div class="field"><label>Quantity</label><input type="number" min="1" step="1" data-cart-qty="${i}" value="${esc(p.quantity)}"></div>
 <div class="field"><label>Unit Price ($)</label><input type="number" min="0" step="0.01" data-cart-price="${i}" value="${esc(p.unit_price)}"></div></div>
 <div class="meta">Catalog cost: ${money(p.unit_cost)} · Line total: <span data-line-total="${i}">${money(p.quantity*p.unit_price)}</span></div>
 <div class="actions">${btn('cartRemove:'+i,'Remove','danger')}</div></div>`}
function drawPartsCart(){const el=document.getElementById('partsCart');if(!el)return;el.innerHTML=partsCart.length?partsCart.map(partsCartRow).join(''):'<p class="meta">Your list is empty. Search for a part or create a new one.</p>';
 const count=document.getElementById('cartCount');if(count)count.textContent=partsCart.length+' part line'+(partsCart.length===1?'':'s');
 const save=document.getElementById('commitParts');if(save)save.disabled=!partsCart.length;
 const total=document.getElementById('cartTotal');if(total)total.textContent=money(partsCart.reduce((n,p)=>n+p.quantity*p.unit_price,0));}
function drawPartsMatches(){const holder=document.getElementById('partMatches');if(!holder)return;const term=document.getElementById('partSearch')?.value.trim()||'';
 if(term.length<2){holder.style.display='none';holder.innerHTML='';return}
 holder.style.display='block';holder.innerHTML=partsResults.length?partsResults.map(p=>`<button type="button" class="part-result" data-pick-part="${esc(p.id)}"><b>${esc(p.name)}</b><small>${esc(p.part_number||'No part number')}${p.description?' · '+esc(p.description):''}</small></button>`).join(''):'<p class="meta">No matching parts. Use + New Part to create one.</p>';}
async function lookupParts(){const input=document.getElementById('partSearch');if(!input)return;const term=input.value.trim(),seq=++partsSearchSerial;
 if(term.length<2){partsResults=[];drawPartsMatches();return}
 const holder=document.getElementById('partMatches');holder.style.display='block';holder.innerHTML='<p class="meta">Searching...</p>';
 try{const {data,error}=await db.rpc('search_parts_catalog',{search_text:term,result_limit:12});if(error)throw error;
 if(seq!==partsSearchSerial||!document.getElementById('partSearch'))return;partsResults=(data||[]).filter(p=>p.active!==false).slice(0,12);drawPartsMatches();}
 catch(e){if(seq===partsSearchSerial&&holder.isConnected)holder.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
function addPartsCartItem(p){const current=partsCart.find(x=>x.catalog_part_id===p.id);if(current)current.quantity++;
 else partsCart.push({catalog_part_id:p.id,name:p.name,part_number:p.part_number||'',quantity:1,unit_cost:Number(p.unit_cost||0),unit_price:Number(p.unit_price||0)});
 const input=document.getElementById('partSearch');if(input)input.value='';partsResults=[];drawPartsMatches();drawPartsCart();input?.focus();}
function showNewPart(show=true){const box=document.getElementById('newPartPanel');if(!box)return;box.style.display=show?'block':'none';if(show){const input=document.getElementById('partSearch');const n=document.getElementById('newPartName');if(n&&!n.value)n.value=input?.value.trim()||'';n?.focus()}}
async function partsPage(){if(!partsAuthorized())return toast('Only the lead technician can manage parts.',true);
 partsContextOrder=selected;partsCart=[];partsEditing=null;
 app.innerHTML=`<div class="back">${btn('cancelParts','← Back to Work Order')}</div>
 <div class="card"><h1 class="title">Add Work Order Parts</h1><p class="meta">Search by name or part number. Results appear as you type. Build your list, then save all parts to this work order.</p>
 <div class="field"><label for="partSearch">Find a Part</label><input id="partSearch" autocomplete="off" placeholder="Type at least 2 characters..."></div>
 <div id="partMatches" class="part-results" style="display:none;max-height:240px;overflow-y:auto"></div>
 <div class="actions">${btn('newCatalogPart','+ New Part')}</div>
 <div id="newPartPanel" class="part-picker" style="display:none"><h2>New Catalog Part</h2><p class="meta">Only the name is required. This becomes a shared catalog part.</p>
 <form id="newCatalogPartForm"><div class="field"><label for="newPartName">Part Name *</label><input id="newPartName" required maxlength="200"></div>
 <div class="field"><label for="newPartNumber">Part Number (optional)</label><input id="newPartNumber"></div>
 <div class="grid"><div class="field"><label for="newPartCost">Unit Cost ($)</label><input id="newPartCost" type="number" min="0" step="0.01" placeholder="Optional"></div>
 <div class="field"><label for="newPartPrice">Unit Price ($)</label><input id="newPartPrice" type="number" min="0" step="0.01" placeholder="Optional"></div></div>
 <div class="actions"><button type="submit" class="btn dark" id="saveNewCatalogPart">Create & Add to List</button>${btn('closeNewPart','Cancel')}</div></form></div></div>
 <div class="card"><h2>Parts to Add <span class="meta" id="cartCount"></span></h2><div id="partsCart"></div>
 <div class="item"><b>Estimated parts total: <span id="cartTotal">$0.00</span></b></div>
 <div class="actions"><button id="commitParts" class="btn dark" data-act="commitParts">Add Parts to Work Order</button>${btn('cancelParts','Cancel')}</div></div>`;
 document.getElementById('partSearch').addEventListener('input',lookupParts);
 document.getElementById('newCatalogPartForm').addEventListener('submit',createTechnicianCatalogPart);
 document.getElementById('partsCart').addEventListener('input',e=>{const q=e.target.closest('[data-cart-qty]'),price=e.target.closest('[data-cart-price]');if(!q&&!price)return;const idx=Number((q||price).dataset[q?'cartQty':'cartPrice']);const item=partsCart[idx];if(!item)return;if(q)item.quantity=Number(q.value);else item.unit_price=Number(price.value);const total=document.querySelector(`[data-line-total="${idx}"]`);if(total)total.textContent=money(item.quantity*item.unit_price);const sum=document.getElementById('cartTotal');if(sum)sum.textContent=money(partsCart.reduce((n,p)=>n+p.quantity*p.unit_price,0))});
 drawPartsCart();}
async function createTechnicianCatalogPart(e){e.preventDefault();if(busy)return;if(!partsAuthorized()||partsContextOrder!==selected)return toast('Work order access changed.',true);
 const name=document.getElementById('newPartName').value.trim(),number=document.getElementById('newPartNumber').value.trim(),c=document.getElementById('newPartCost').value,p=document.getElementById('newPartPrice').value;
 const cost=c===''?0:Number(c),price=p===''?0:Number(p);if(!name)return toast('Part name is required.',true);
 if(!Number.isFinite(cost)||cost<0||!Number.isFinite(price)||price<0)return toast('Enter valid nonnegative prices.',true);
 busy=true;const button=document.getElementById('saveNewCatalogPart');button.disabled=true;
 try{const {data:matches,error:me}=await db.rpc('search_parts_catalog',{search_text:name,result_limit:50});if(me)throw me;
 const duplicate=(matches||[]).find(x=>x.active!==false&&((x.name||'').trim().toLowerCase()===name.toLowerCase()||(number&&(x.part_number||'').trim().toLowerCase()===number.toLowerCase())));
 if(duplicate)throw Error('This part may already exist. Search and select it rather than creating a duplicate.');
 const {data,error}=await db.from('parts_catalog').insert({name,part_number:number||null,unit_cost:cost,unit_price:price,quantity_on_hand:0}).select('id,name,part_number,unit_cost,unit_price').single();if(error)throw error;
 addPartsCartItem(data);showNewPart(false);document.getElementById('newCatalogPartForm').reset();toast('Part created in catalog and added to your list.');}
 catch(err){fail(err)}finally{busy=false;if(button.isConnected)button.disabled=false}}
async function commitPartsCart(){if(busy)return;if(!partsAuthorized()||partsContextOrder!==selected)return toast('Work order access changed.',true);
 if(!partsCart.length)return toast('Add a part to your list first.',true);
 for(const p of partsCart)if(!Number.isInteger(p.quantity)||p.quantity<1||!Number.isFinite(p.unit_price)||p.unit_price<0)return toast('Check quantities and prices. Quantity must be a positive whole number.',true);
 busy=true;const button=document.getElementById('commitParts');if(button)button.disabled=true;
 try{const payload=partsCart.map(p=>({service_call_id:selected,catalog_part_id:p.catalog_part_id,part_number:p.part_number||null,description:p.name,quantity:p.quantity,unit_cost:p.unit_cost,unit_price:p.unit_price}));
 const {error}=await db.from('parts').insert(payload);if(error)throw error;partsCart=[];await refresh();toast('All parts added to Work Order.');}
 catch(err){fail(err)}finally{busy=false;if(button?.isConnected)button.disabled=false}}
async function partForm(id){if(!id)return partsPage();
 try{if(!partsAuthorized())throw Error('Only the lead technician can manage parts.');const x=await getRow('parts',id);
 form('Edit Work Order Part',`<p class="meta">${esc(x.description||x.part_number||'Part')}</p>`+field('quantity','Quantity',x.quantity??1,'number',true)+field('unit_price','Unit Price ($)',x.unit_price??x.unit_cost??0,'number',true)+field('unit_cost','Unit Cost ($)',x.unit_cost??0,'number',true),async f=>{
 const quantity=Number(f.get('quantity')),price=Number(f.get('unit_price')),cost=Number(f.get('unit_cost'));
 if(!Number.isInteger(quantity)||quantity<1||![price,cost].every(v=>Number.isFinite(v)&&v>=0))throw Error('Enter a valid quantity, cost and price.');
 const {error}=await db.from('parts').update({quantity,unit_price:price,unit_cost:cost}).eq('id',id).eq('service_call_id',selected);if(error)throw error;
 // Update catalog defaults only through the controlled technician pricing function.
 if(x.catalog_part_id&&confirm('Also update the shared catalog default cost and selling price?')){
 const {error:ce}=await db.rpc('technician_set_catalog_prices',{p_part_id:x.catalog_part_id,p_unit_cost:cost,p_unit_price:price});if(ce)toast('Work order updated, but catalog pricing could not be updated: '+ce.message,true);
 }
 });}catch(e){fail(e)}}
async function noteForm(id){try{const x=id?await getRow('service_call_notes',id):{};if(x.is_completion_note)throw Error('Completion notes cannot be edited.');form(id?'Edit Note':'Add Note',area('note','Note',x.note||'',true),async f=>{const note=String(f.get('note')).trim();if(!note)throw Error('Enter a note.');const query=id?db.from('service_call_notes').update({note}).eq('id',id).eq('service_call_id',selected):db.from('service_call_notes').insert({service_call_id:selected,user_id:profile.id,note,is_completion_note:false});const {error}=await query;if(error)throw error})}catch(e){fail(e)}}
function photoForm(){form('Add Photo',`<div class="field"><label for="photoFile">Photo (10 MB maximum)</label><input id="photoFile" type="file" name="photo" accept="image/*" required></div>`+field('caption','Caption'),async f=>{const file=f.get('photo');if(!(file instanceof File)||!file.type.startsWith('image/')||file.size>10*1024*1024)throw Error('Choose an image under 10 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${selected}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await db.storage.from('dispatch-photos').upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;const {error}=await db.from('service_call_photos').insert({service_call_id:selected,file_path:path,caption:String(f.get('caption')).trim()});if(error){await db.storage.from('dispatch-photos').remove([path]);throw error}})}
function completionForm(){
 const o=orders.find(x=>x.id===selected);
 if(!o)return toast('Work Order unavailable.',true);
 const lead=isLead(o),quoted=isQuoted(o);
 const billing=lead&&!quoted?`<p class="meta">Enter the shared labor summary once for the entire Work Order.</p>
 <div class="field"><label>Service Classification</label><select name="service_classification" required>
 <option value="">Choose classification</option>${['residential','commercial','industrial'].map(x=>`<option value="${x}" ${o.service_classification===x?'selected':''}>${label(x)}</option>`).join('')}</select></div>
 <div class="grid">${field('labor_hours','Elapsed Labor Hours (whole number)',o.labor_hours??'','number',true)}${field('labor_technician_count','Number of Technicians',o.labor_technician_count??Math.max(1,teamFor(o).length),'number',true)}</div>
 <div class="field"><label>Trip Charge</label><select name="trip_charge" required><option value="">Choose</option><option value="yes" ${o.trip_charge===true?'selected':''}>Yes</option><option value="no" ${o.trip_charge===false?'selected':''}>No</option></select></div>`:'';
 form(lead?'Complete Work Order':'Submit Completion Note',
 `<p class="meta">${lead?'Your completion note will finalize the Work Order.':'Your completion note will be saved; the lead technician will finalize the Work Order.'} ${quoted?'Quoted Work Order — no labor billing fields are required.':''}</p>`+billing+area('note','Completion Note','',true),async f=>{
 const note=String(f.get('note')).trim();if(!note)throw Error('Completion note is required.');
 const args={p_work_order_id:selected,p_completion_note:note,p_service_classification:null,p_labor_hours:null,p_labor_technician_count:null,p_trip_charge:null};
 if(lead&&!quoted){
  const hours=Number(f.get('labor_hours')),count=Number(f.get('labor_technician_count'));
  if(!Number.isInteger(hours)||hours<0||!Number.isInteger(count)||count<1)throw Error('Hours must be a whole number of zero or more; technician count must be at least one.');
  if(!['yes','no'].includes(f.get('trip_charge')))throw Error('Choose whether a trip charge applies.');
  args.p_service_classification=String(f.get('service_classification'));
  args.p_labor_hours=hours;args.p_labor_technician_count=count;args.p_trip_charge=f.get('trip_charge')==='yes';
 }
 const {data,error}=await db.rpc('technician_submit_work_order_completion',args);if(error)throw error;
 toast(data==='completed'?'Work Order completed.':'Completion note submitted to lead technician.');
 });
}

async function changeStatus(status){if(busy)return;busy=true;try{const {error}=await db.from('service_calls').update({status}).eq('id',selected);if(error)throw error;await refresh();toast('Status updated.')}catch(e){fail(e)}finally{busy=false}}
async function remove(table,id){if(!confirm('Delete this item?'))return;try{const x=await getRow(table,id);if(table==='service_call_notes'&&x.is_completion_note)throw Error('Completion notes cannot be deleted.');if(table==='service_call_photos'&&x.file_path&&!/^https?:\/\//i.test(x.file_path)){const {error}=await db.storage.from('dispatch-photos').remove([x.file_path]);if(error)throw error}const {error}=await db.from(table).delete().eq('id',id).eq('service_call_id',selected);if(error)throw error;await refresh();toast('Deleted.')}catch(e){fail(e)}}
app.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;selected=null;selectedBlock=null;render();return}const act=t.dataset.act;if(!act)return;const [cmd,arg]=act.split(':');if(cmd==='back'){selected=null;selectedBlock=null;render()}else if(cmd==='backBlock'){selectedBlock=null;tab='schedule';render()}else if(cmd==='openBlock'){if(blocks.some(x=>x.id===arg)){selectedBlock=arg;selected=null;render()}}else if(cmd==='backDetail'){render()}else if(cmd==='refresh'){await refresh()}else if(cmd==='newRequest'){requestForm()}else if(cmd==='backRequests'){tab='requests';render()}else if(cmd==='backSchedule'){tab='schedule';selectedBlock=null;render()}else if(cmd==='changeBlock'){const b=blocks.find(x=>x.id===arg);if(b){selectedBlock=null;requestForm(b)}}else if(cmd==='withdraw'){if(confirm('Withdraw this pending request?')){const {error}=await db.rpc('technician_withdraw_schedule_request',{p_request_id:arg});if(error)fail(error);else{await refresh();toast('Request withdrawn.')}}}else if(cmd==='open'){selected=arg;selectedBlock=null;render()}else if(cmd==='status'){await changeStatus(arg)}else if(cmd==='complete'){completionForm()}else if(cmd==='partForm'){await partForm()}else if(cmd==='newCatalogPart'){showNewPart(true)}else if(cmd==='closeNewPart'){showNewPart(false)}else if(cmd==='cancelParts'){if(partsCart.length&&!confirm('Discard your unsaved parts list?'))return;partsCart=[];render()}else if(cmd==='cartRemove'){partsCart.splice(Number(arg),1);drawPartsCart()}else if(cmd==='commitParts'){await commitPartsCart()}else if(cmd==='noteForm'){await noteForm()}else if(cmd==='photoForm'){photoForm()}else if(cmd==='editPart'){await partForm(arg)}else if(cmd==='editNote'){await noteForm(arg)}else if(cmd==='delPart'){await remove('parts',arg)}else if(cmd==='delNote'){await remove('service_call_notes',arg)}else if(cmd==='delPhoto'){await remove('service_call_photos',arg)}});
document.getElementById('signout').addEventListener('click',async()=>{await db.auth.signOut();location.replace('login.html')});init();
</script></body></html>
