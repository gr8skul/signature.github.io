<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature | Technician</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#202326;--muted:#697078;--line:#dfe2e6;--green:#356b45;--red:#a52a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px Arial,Helvetica,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--line);padding:14px max(16px,calc((100vw - 850px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:19px;font-weight:800;letter-spacing:.7px}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.user{font-size:12px;text-align:right;color:var(--muted)}main{max-width:850px;margin:0 auto;padding:20px 16px 90px}
.title{font-size:25px;margin:5px 0}
.sub{color:var(--muted);margin:5px 0 20px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}
.tab{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:11px 14px;border-radius:7px}
.tab.active,.dark{background:#222;color:#fff;border-color:#222}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px;margin:12px 0}
.card h2{font-size:18px;margin:5px 0 12px}
.meta{color:var(--muted);font-size:13px;line-height:1.7}
.pill{font-size:11px;border-radius:4px;padding:5px 7px;background:#edf0f2;display:inline-block;margin:3px 5px 5px 0;text-transform:capitalize}
.released{background:#e5efe7;color:var(--green)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:11px 14px;min-height:43px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.dark{background:#222;color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.btn.danger{color:var(--red)}
.section{margin:20px 0}
.section h3{font-size:16px;margin:0 0 10px}
.field{margin:12px 0}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cfd3d7;border-radius:6px;background:white}textarea{min-height:95px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{padding:12px 0;border-bottom:1px solid #eceef0;overflow-wrap:anywhere}
.item:last-child{border:0}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.back{margin-bottom:15px}
.notice{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.error{color:var(--red)}
.thumb{width:110px;height:85px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:7px;padding:13px 18px;display:none;z-index:9;max-width:90vw}#toast.bad{background:var(--red)}
@media(max-width:550px){.grid{grid-template-columns:1fr}
.actions .btn{flex:1}
.user{max-width:135px;overflow-wrap:anywhere}
.card{padding:14px}main{padding:16px 12px 80px}}
</style></head><body>
<header><div class="brand">SIGNATURE<small>TECHNICIAN PORTAL</small></div><div class="user"><div id="who">Signing in...</div><button class="btn" id="signout" style="margin-top:6px;padding:6px 10px;min-height:30px">Sign Out</button></div></header>
<main><div id="app" class="empty">Loading technician work orders...</div></main><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SUPABASE_URL='https://zpawrfdfutswbvhlwvqf.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_NGa3aWmkMCXm45Hf4m-RYQ_QitmMq68';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let profile=null,tech=null,orders=[],tab='upcoming',selected=null,busy=false;
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=c=>c?.company_name||[c?.first_name,c?.last_name].filter(Boolean).join(' ')||'Customer';
const date=x=>x?new Date(x).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Not scheduled';
const label=x=>String(x||'open').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const wo=x=>x.work_order_number==null?'Work Order':`WO-${String(x.work_order_number).padStart(6,'0')}`;
const address=x=>[x?.address,x?.city,x?.state,x?.zip].filter(Boolean).join(', ');
function toast(s,bad=false){const t=document.getElementById('toast');t.textContent=s;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4800)}
function fail(e){console.error(e);toast(e?.message||String(e),true)}
function btn(id,text,klass=''){return `<button class="btn ${klass}" data-act="${id}">${esc(text)}</button>`}
async function init(){try{const {data:{session},error:e}=await db.auth.getSession();if(e)throw e;if(!session){location.replace('login.html');return}const {data:u,error:ue}=await db.from('users').select('id,first_name,last_name,role,active').eq('auth_user_id',session.user.id).single();if(ue)throw ue;if(u?.role!=='technician'||!u.active)throw Error('This page is for active technician accounts. Please sign in with a technician account.');profile=u;const {data:t,error:te}=await db.from('technicians').select('id,first_name,last_name,active').eq('user_id',u.id).single();if(te)throw te;if(!t?.active)throw Error('Technician profile is inactive.');tech=t;document.getElementById('who').textContent=[t.first_name,t.last_name].filter(Boolean).join(' ');await refresh()}catch(e){console.error(e);app.innerHTML=`<div class="notice error">${esc(e.message||'Unable to load account.')}</div>`}}
async function refresh(){const {data,error}=await db.from('service_calls').select('id,work_order_number,work_type,status,priority,description,scheduled_at,started_at,completed_at,released,assigned_technician_id,customers(first_name,last_name,company_name,phone,email),locations(address,city,state,zip,notes)').eq('assigned_technician_id',tech.id).eq('released',true).order('scheduled_at',{ascending:true,nullsFirst:false});if(error){fail(error);app.innerHTML=`<div class="notice error">Unable to load work orders: ${esc(error.message)}</div>`;return}orders=data||[];if(selected&&!orders.some(o=>o.id===selected)){selected=null;toast('This work order is no longer available.')}render()}
function filtered(){
  if(tab==='upcoming')return orders.filter(o=>o.status==='scheduled'||o.status==='open');
  if(tab==='current')return orders.filter(o=>o.status==='in_progress');
  return orders.filter(o=>o.status==='completed');
}
function render(){
  if(selected){const o=orders.find(x=>x.id===selected);if(o)return detail(o)}
  const counts={upcoming:orders.filter(o=>['scheduled','open'].includes(o.status)).length,current:orders.filter(o=>o.status==='in_progress').length,completed:orders.filter(o=>o.status==='completed').length};
  app.innerHTML=`<h1 class="title">My Work Orders</h1><p class="sub">Assigned and released by Dispatch.</p>
  <div class="tabs">${[['upcoming','Upcoming'],['current','Current'],['completed','Completed']].map(([k,n])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${n} (${counts[k]})</button>`).join('')}</div>
  <div class="actions" style="margin-bottom:12px">${btn('refresh','↻ Refresh')}</div>
  ${filtered().length?filtered().map(o=>`<article class="card"><div class="meta"><b>${esc(wo(o))}</b> · ${esc(date(o.scheduled_at))}</div>
  <span class="pill">${esc(label(o.status))}</span><h2>${esc(o.description||'Work Order')}</h2>
  <div class="meta">${esc(name(o.customers))} · ${esc(address(o.locations))}</div>
  <div class="actions">${btn('open:'+o.id,'Open Work Order','dark')}</div></article>`).join(''):'<div class="empty">No work orders in this section.</div>'}`;
}
function detail(o){
 const tel=o.customers?.phone||'';
 const addr=address(o.locations);
 const map=addr?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr):'';
 app.innerHTML=`<div class="back">${btn('back','← Work Orders')}</div>
 <div class="card"><div class="meta">${esc(wo(o))}</div><h1 class="title">${esc(o.description||'Work Order')}</h1>
 <span class="pill">${esc(label(o.status))}</span>
 <div class="section"><h3>CUSTOMER</h3><strong>${esc(name(o.customers))}</strong><div class="meta">${esc(addr)}</div>
 <div class="actions">${tel?`<a class="btn" href="tel:${esc(tel.replace(/[^\d+]/g,''))}">☎ Call</a>`:''}${map?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(map)}">↗ Directions</a>`:''}</div></div>
 <div class="section"><h3>WORK DESCRIPTION</h3><p>${esc(o.description||'No description provided.')}</p>
 ${o.locations?.notes?`<p class="meta">Location notes: ${esc(o.locations.notes)}</p>`:''}</div>
 <div class="actions">${o.status==='scheduled'?btn('status:in_progress','Start Work','dark'):''}
 ${o.status==='in_progress'?btn('status:scheduled','Return to Upcoming')+btn('complete','Complete Work Order','dark'):''}
 ${o.status==='completed'?btn('status:in_progress','Reopen Work Order'):''}</div></div>
 <div class="card"><div class="section"><h3>Parts</h3><div id="parts">Loading...</div>${btn('partForm','+ Add Part')}</div></div>
 <div class="card"><div class="section"><h3>Notes</h3><div id="notes">Loading...</div>${btn('noteForm','+ Add Note')}</div></div>
 <div class="card"><div class="section"><h3>Photos</h3><div id="photos">Loading...</div>${btn('photoForm','+ Add Photo')}</div></div>
 <div class="card"><div class="section"><h3>Status History</h3><div id="history">Loading...</div></div></div>`;
 loadRelated(o.id);
}
async function loadRelated(id){const results=await Promise.all([db.from('parts').select('*').eq('service_call_id',id).order('created_at',{ascending:false}),db.from('service_call_notes').select('*').eq('service_call_id',id).order('created_at',{ascending:false}),db.from('service_call_photos').select('*').eq('service_call_id',id).order('created_at',{ascending:false}),db.from('service_call_status_history').select('*').eq('service_call_id',id).order('created_at',{ascending:false})]);if(selected!==id)return;const [p,n,ph,h]=results;const target=k=>document.getElementById(k);const error=x=>`<div class="error">${esc(x.message)}</div>`;target('parts').innerHTML=p.error?error(p.error):(p.data.length?p.data.map(x=>`<div class="item"><b>${esc(x.part_number||x.description||'Part')}</b> · Qty ${esc(x.quantity??0)}${x.description&&x.part_number?`<div class="meta">${esc(x.description)}</div>`:''}<div class="actions">${btn('editPart:'+x.id,'Edit')}${btn('delPart:'+x.id,'Delete','danger')}</div></div>`).join(''):'<p class="meta">No parts recorded.</p>');target('notes').innerHTML=n.error?error(n.error):(n.data.length?n.data.map(x=>`<div class="item">${x.is_completion_note?'<span class="pill released">Completion Note</span>':''}<div>${esc(x.note)}</div><div class="meta">${esc(date(x.created_at))}</div>${!x.is_completion_note&&x.user_id===profile.id?`<div class="actions">${btn('editNote:'+x.id,'Edit')}${btn('delNote:'+x.id,'Delete','danger')}</div>`:''}</div>`).join(''):'<p class="meta">No notes recorded.</p>');target('history').innerHTML=h.error?error(h.error):(h.data.length?h.data.map(x=>`<div class="item"><b>${esc(label(x.status))}</b><div class="meta">${esc(date(x.created_at))}</div></div>`).join(''):'<p class="meta">No status changes recorded yet.</p>');if(ph.error){target('photos').innerHTML=error(ph.error)}else{const rows=await Promise.all(ph.data.map(async x=>{let pic='';if(x.file_path&&!/^https?:\/\//i.test(x.file_path)){const {data}=await db.storage.from('dispatch-photos').createSignedUrl(x.file_path,1800);pic=data?.signedUrl||''}return `<div class="item">${pic?`<a href="${esc(pic)}" target="_blank" rel="noopener noreferrer"><img class="thumb" src="${esc(pic)}" alt="Work order photo"></a>`:''}<div>${esc(x.caption||'Photo')}</div><div class="actions">${btn('delPhoto:'+x.id,'Delete Photo','danger')}</div></div>`}));if(selected===id)target('photos').innerHTML=rows.length?rows.join(''):'<p class="meta">No photos recorded.</p>'}}
function form(title,fields,action){app.innerHTML=`<div class="back">${btn('backDetail','← Back to Work Order')}</div><div class="card"><h1 class="title">${esc(title)}</h1><form id="editForm">${fields}<div class="actions"><button type="submit" class="btn dark" id="saveButton">Save</button><button type="button" class="btn" data-act="backDetail">Cancel</button></div></form></div>`;document.getElementById('editForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;const b=document.getElementById('saveButton');b.disabled=true;try{await action(new FormData(e.target));await refresh();toast('Saved.')}catch(err){fail(err)}finally{busy=false;if(b.isConnected)b.disabled=false}})}
function field(n,label,value='',type='text',required=false){return `<div class="field"><label for="f_${n}">${esc(label)}</label><input id="f_${n}" name="${n}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`}
function area(n,label,value='',required=false){return `<div class="field"><label for="f_${n}">${esc(label)}</label><textarea id="f_${n}" name="${n}" ${required?'required':''}>${esc(value)}</textarea></div>`}
async function getRow(table,id){const {data,error}=await db.from(table).select('*').eq('id',id).eq('service_call_id',selected).single();if(error)throw error;return data}
async function partForm(id){try{const x=id?await getRow('parts',id):{};form(id?'Edit Part':'Add Part',field('part_number','Part Number',x.part_number||'')+area('description','Description',x.description||'')+`<div class="grid">${field('quantity','Quantity',x.quantity??1,'number',true)}${field('unit_cost','Unit Cost',x.unit_cost??0,'number')}</div>`,async f=>{const q=Number(f.get('quantity')),cost=Number(f.get('unit_cost'));if(!Number.isInteger(q)||q<1||!Number.isFinite(cost)||cost<0)throw Error('Enter a valid quantity and unit cost.');const payload={part_number:String(f.get('part_number')).trim(),description:String(f.get('description')).trim(),quantity:q,unit_cost:cost};const query=id?db.from('parts').update(payload).eq('id',id).eq('service_call_id',selected):db.from('parts').insert({...payload,service_call_id:selected});const {error}=await query;if(error)throw error})}catch(e){fail(e)}}
async function noteForm(id){try{const x=id?await getRow('service_call_notes',id):{};if(x.is_completion_note)throw Error('Completion notes cannot be edited.');form(id?'Edit Note':'Add Note',area('note','Note',x.note||'',true),async f=>{const note=String(f.get('note')).trim();if(!note)throw Error('Enter a note.');const query=id?db.from('service_call_notes').update({note}).eq('id',id).eq('service_call_id',selected):db.from('service_call_notes').insert({service_call_id:selected,user_id:profile.id,note,is_completion_note:false});const {error}=await query;if(error)throw error})}catch(e){fail(e)}}
function photoForm(){form('Add Photo',`<div class="field"><label for="photoFile">Photo (10 MB maximum)</label><input id="photoFile" type="file" name="photo" accept="image/*" required></div>`+field('caption','Caption'),async f=>{const file=f.get('photo');if(!(file instanceof File)||!file.type.startsWith('image/')||file.size>10*1024*1024)throw Error('Choose an image under 10 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${selected}/${crypto.randomUUID()}
.${ext}`;const {error:uploadError}=await db.storage.from('dispatch-photos').upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;const {error}=await db.from('service_call_photos').insert({service_call_id:selected,file_path:path,caption:String(f.get('caption')).trim()});if(error){await db.storage.from('dispatch-photos').remove([path]);throw error}})}
function completionForm(){form('Complete Work Order',`<p class="meta">A completion note is required. This note becomes part of the permanent work-order record.</p>`+area('note','Completion Note','',true),async f=>{const note=String(f.get('note')).trim();if(!note)throw Error('Completion note is required.');const {error}=await db.rpc('technician_complete_work_order',{p_work_order_id:selected,p_completion_note:note});if(error)throw error})}
async function changeStatus(status){if(busy)return;busy=true;try{const {error}=await db.from('service_calls').update({status}).eq('id',selected);if(error)throw error;await refresh();toast('Status updated.')}catch(e){fail(e)}finally{busy=false}}
async function remove(table,id){if(!confirm('Delete this item?'))return;try{const x=await getRow(table,id);if(table==='service_call_notes'&&x.is_completion_note)throw Error('Completion notes cannot be deleted.');if(table==='service_call_photos'&&x.file_path&&!/^https?:\/\//i.test(x.file_path)){const {error}=await db.storage.from('dispatch-photos').remove([x.file_path]);if(error)throw error}const {error}=await db.from(table).delete().eq('id',id).eq('service_call_id',selected);if(error)throw error;await refresh();toast('Deleted.')}catch(e){fail(e)}}
app.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;selected=null;render();return}const act=t.dataset.act;if(!act)return;const [cmd,arg]=act.split(':');if(cmd==='back'){selected=null;render()}else if(cmd==='backDetail'){render()}else if(cmd==='refresh'){await refresh()}else if(cmd==='open'){selected=arg;render()}else if(cmd==='status'){await changeStatus(arg)}else if(cmd==='complete'){completionForm()}else if(cmd==='partForm'){await partForm()}else if(cmd==='noteForm'){await noteForm()}else if(cmd==='photoForm'){photoForm()}else if(cmd==='editPart'){await partForm(arg)}else if(cmd==='editNote'){await noteForm(arg)}else if(cmd==='delPart'){await remove('parts',arg)}else if(cmd==='delNote'){await remove('service_call_notes',arg)}else if(cmd==='delPhoto'){await remove('service_call_photos',arg)}});
document.getElementById('signout').addEventListener('click',async()=>{await db.auth.signOut();location.replace('login.html')});init();
</script></body></html>
