<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature | Phone</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{font-family:Arial,Helvetica,sans-serif;color:#202326;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ddd;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:19px;margin:0}main{max-width:700px;margin:auto;padding:14px}button,a.action{border:1px solid #ccd1d5;background:white;border-radius:7px;padding:12px 14px;font:inherit;cursor:pointer;color:inherit;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}button.primary{background:#242424;color:white;border-color:#242424}a.action.call{background:#e7f3eb;border-color:#b7d7c0;color:#205b35}a.action.text{background:#e9effb;border-color:#c5d4ef;color:#244d83}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar button{flex:1}.toolbar button.active{background:#242424;color:white}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #cbd0d4;border-radius:7px;background:white}textarea{min-height:100px;resize:vertical}label{display:block;font-weight:bold;font-size:13px;margin:13px 0 6px}.card{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0}.card h2{font-size:18px;margin:0 0 7px}.muted{color:#666;font-size:13px;line-height:1.5}.purpose{white-space:pre-wrap;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions>*{flex:1;min-width:90px}.error{color:#9d2222}.empty{text-align:center;color:#777;padding:35px 10px}.overdue{border-left:4px solid #a52a2a}.small{font-size:12px}#notice{margin:10px 0;color:#245638}#search{margin-top:12px}</style></head>
<body><header><h1>SIGNATURE · PHONE</h1><button id="refresh" type="button">Refresh</button></header><main><div id="notice" role="status"></div><div class="toolbar"><button class="active" data-view="pending">To Call</button><button data-view="all">All Calls</button><button data-view="history">History</button></div><input id="search" type="search" placeholder="Search name, phone, purpose, work order…"><div id="list" class="empty">Loading…</div></main>
<script>
const db=supabase.createClient('https://zpawrfdfutswbvhlwvqf.supabase.co','sb_publishable_NGa3aWmkMCXm45Hf4m-RYQ_QitmMq68');
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tel=s=>String(s||'').replace(/[^0-9+]/g,'');const date=s=>s?new Date(s).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'Not scheduled';
let profile=null,tasks=[],history=[],view='pending',version=0;
function message(t,err=false){$('notice').textContent=t;$('notice').className=err?'error':'';}
function name(x){return x.contact_name||x.customers?.company_name||[x.customers?.first_name,x.customers?.last_name].filter(Boolean).join(' ')||'Contact';}
function wo(x){return x.service_calls?.work_order_number==null?'General call':'WO-'+String(x.service_calls.work_order_number).padStart(6,'0');}
function number(x){return x.phone_number||x.customers?.phone||'';}
function actions(x){const n=tel(number(x));return n?`<a class="action call" href="tel:${safe(n)}">☎ Call</a><a class="action text" href="sms:${safe(n)}">✉ Text</a>`:'<span class="muted">No phone number</span>';}
async function init(){try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.href='login.html?next=phone.html';return;}const r=await db.from('users').select('id,role,active').eq('auth_user_id',session.user.id).single();if(r.error)throw r.error;profile=r.data;if(!['dispatcher','secretary'].includes(profile.role)||profile.active===false){$('list').textContent='This page is available to dispatchers and secretaries.';return;}await refresh();}catch(e){console.error(e);$('list').textContent='Unable to sign in: '+e.message;}}
async function refresh(){const token=++version;$('list').innerHTML='<div class="empty">Loading…</div>';try{const [a,b]=await Promise.all([db.from('communication_tasks').select('*,customers(first_name,last_name,company_name,phone),service_calls(work_order_number)').order('scheduled_at',{ascending:true,nullsFirst:false}).limit(1000),db.from('communications').select('*,customers(first_name,last_name,company_name,phone),service_calls(work_order_number)').order('occurred_at',{ascending:false}).limit(1000)]);if(a.error)throw a.error;if(b.error)throw b.error;if(token!==version)return;tasks=a.data||[];history=b.data||[];render();}catch(e){console.error(e);$('list').innerHTML='<div class="error">Could not load calls: '+safe(e.message)+'</div>';}}
function render(){const q=$('search').value.trim().toLowerCase();const match=x=>[name(x),number(x),x.purpose,x.notes,x.answer,x.outcome,wo(x)].join(' ').toLowerCase().includes(q);const records=view==='history'?history.filter(match):tasks.filter(x=>(view==='all'||x.status==='pending')&&match);$('list').innerHTML=records.length?records.map(x=>view==='history'?historyCard(x):taskCard(x)).join(''):'<div class="empty">No matching calls.</div>';document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>showLog(b.dataset.log));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=render);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveLog(b.dataset.save));}
function taskCard(x){const overdue=x.status==='pending'&&x.scheduled_at&&new Date(x.scheduled_at)<new Date();return `<article class="card ${overdue?'overdue':''}" id="task-${safe(x.id)}"><h2>${safe(name(x))}</h2><div class="muted">${safe(wo(x))} · ${safe(date(x.scheduled_at))} · ${safe(x.status)}${overdue?' · Overdue':''}</div><div class="muted">${safe(number(x))}</div><p class="purpose">${safe(x.purpose||'No purpose entered')}</p><div class="actions">${actions(x)}<button type="button" class="primary" data-log="${safe(x.id)}">Record Response</button></div></article>`;}
function historyCard(x){return `<article class="card"><h2>${safe(name(x))}</h2><div class="muted">${safe(wo(x))} · ${safe(date(x.occurred_at))} · ${safe(x.communication_type||'phone')} · ${safe(x.outcome||'')}</div><p class="purpose"><strong>Purpose:</strong> ${safe(x.purpose||'—')}<br><strong>Answer:</strong> ${safe(x.answer||x.notes||'—')}</p><div class="actions">${actions(x)}</div></article>`;}
function showLog(id){const x=tasks.find(t=>t.id===id);if(!x)return;const card=$('task-'+id);if(!card)return;card.innerHTML=`<h2>${safe(name(x))}</h2><div class="muted">${safe(wo(x))} · ${safe(number(x))}</div><p class="purpose">${safe(x.purpose||'')}</p><div class="actions">${actions(x)}</div><label for="method-${id}">Contact method</label><select id="method-${id}"><option value="phone" ${x.task_type==='phone'?'selected':''}>Phone</option><option value="text" ${x.task_type==='text'?'selected':''}>Text</option><option value="other">Other</option></select><label for="outcome-${id}">Result</label><select id="outcome-${id}"><option value="spoke">Spoke with contact</option><option value="voicemail">Left voicemail</option><option value="no_answer">No answer</option><option value="message_sent">Message sent</option><option value="message_received">Message received</option><option value="other">Other</option></select><label for="answer-${id}">Answer / Response</label><textarea id="answer-${id}" placeholder="What did they say?"></textarea><label style="font-weight:normal"><input type="checkbox" id="done-${id}" style="width:auto"> Mark scheduled call complete</label><div class="actions"><button data-back="1">Cancel</button><button class="primary" data-save="${safe(id)}">Save Response</button></div>`;card.querySelector('[data-back]').onclick=render;card.querySelector('[data-save]').onclick=()=>saveLog(id);}
async function saveLog(id){const x=tasks.find(t=>t.id===id);if(!x)return;const button=document.querySelector(`[data-save="${id}"]`);if(!button||button.disabled)return;const answer=$('answer-'+id).value.trim();if(!answer){message('Enter the answer / response before saving.',true);return;}button.disabled=true;message('Saving…');try{const payload={service_call_id:x.service_call_id||null,customer_id:x.customer_id||null,contact_name:x.contact_name||null,phone_number:number(x)||null,communication_type:$('method-'+id).value,direction:'outgoing',outcome:$('outcome-'+id).value,purpose:x.purpose||null,answer:answer,notes:null,occurred_at:new Date().toISOString(),created_by_user_id:profile.id};const {data,error}=await db.from('communications').insert(payload).select('id').single();if(error)throw error;if($('done-'+id).checked){const r=await db.from('communication_tasks').update({status:'completed',completed_at:new Date().toISOString(),communication_id:data.id,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw new Error('Response saved, but call completion failed: '+r.error.message);}message('Response saved to Dispatch communication history.');await refresh();}catch(e){console.error(e);message(e.message,true);if(button.isConnected)button.disabled=false;}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render();});$('search').oninput=render;$('refresh').onclick=refresh;init();
</script></body></html>
