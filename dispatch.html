<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signature Dispatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f4f5f7;
      --surface: #ffffff;
      --border: #dfe2e6;
      --text: #202326;
      --muted: #6b7075;
      --accent: #222;
      --danger: #a52a2a;
      --success: #356b45;
      --warning: #8a641f;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      height: 68px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-section {
      color: var(--muted);
      font-size: 14px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
    }

    .user-role {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .sign-out {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      color: var(--text);
    }

    .sign-out:hover {
      background: #f0f1f2;
    }

    .app {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    nav {
      width: 220px;
      background: #fafafa;
      border-right: 1px solid var(--border);
      padding: 22px 14px;
      flex-shrink: 0;
    }

    .nav-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 4px 10px 10px;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 11px 10px;
      margin-bottom: 3px;
      color: var(--text);
    }

    .nav-button:hover,
    .nav-button.active {
      background: #e9eaec;
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1500px;
      width: 100%;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .primary {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font-weight: 600;
    }

    .primary:hover {
      background: #000;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .card-body {
      padding: 18px;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-controls button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 11px;
    }

    .date-controls strong {
      min-width: 190px;
      text-align: center;
      font-size: 15px;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 18px;
      padding: 17px 18px;
      border-bottom: 1px solid #eceef0;
      align-items: center;
    }

    .schedule-item:last-child {
      border-bottom: 0;
    }

    .schedule-time {
      font-size: 14px;
      font-weight: 600;
    }

    .schedule-description {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .schedule-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status,
    .type-badge,
    .release-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status {
      background: #eceef0;
      text-transform: capitalize;
    }

    .type-badge {
      background: #f0f1f2;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-right: 5px;
    }

    .release-badge {
      background: #f0f1f2;
    }

    .release-badge.released {
      background: #e5efe7;
      color: var(--success);
    }

    .release-badge.unreleased {
      background: #f3eee3;
      color: var(--warning);
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #eceef0;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .sort-heading {
      background: transparent;
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      white-space: nowrap;
      cursor: pointer;
    }
    .sort-heading:hover { color: var(--text); text-decoration: underline; }
    .sort-heading:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .row-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .row-button:hover {
      background: #f0f1f2;
    }

    .filter-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .filter-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .filter-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .dispatch-search {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .dispatch-search label { display:block; margin-bottom:7px; }
    .dispatch-search input { max-width: 680px; }
    .dispatch-search .small-muted { margin-top: 7px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd3d7;
      border-radius: 5px;
      padding: 10px 11px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 28px;
    }

    .checkbox-row input {
      width: auto;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

    .secondary {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 15px;
    }

    .secondary:hover {
      background: #f0f1f2;
    }

    .danger {
      background: white;
      color: var(--danger);
      border: 1px solid #d9b5b5;
      border-radius: 5px;
      padding: 10px 15px;
    }

    .danger:hover {
      background: #faf0f0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .detail-item {
      border-bottom: 1px solid #eceef0;
      padding-bottom: 12px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
    }

    .small-muted {
      color: var(--muted);
      font-size: 12px;
    }

    .photo-preview {
      max-width: 180px;
      max-height: 120px;
      border-radius: 5px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    #message {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #222;
      color: white;
      padding: 13px 17px;
      border-radius: 6px;
      display: none;
      z-index: 50;
      font-size: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
      max-width: 420px;
    }

    #message.error {
      background: var(--danger);
    }

    /* Dispatch work-order calendar */
    .calendar-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
    .calendar-toolbar .date-controls strong{min-width:175px}
    .calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
    .calendar-weekdays{background:#fafafa;border-bottom:1px solid var(--border)}
    .calendar-weekdays div{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:12px 3px}
    .calendar-day{min-width:0;min-height:122px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px;background:#fff}
    .calendar-day:nth-child(7n){border-right:0}
    .calendar-day.outside{background:#f7f8f9}
    .calendar-day.today{box-shadow:inset 0 0 0 2px #444}
    .calendar-number{font-size:12px;font-weight:700;margin-bottom:7px}
    .calendar-entry{display:block;width:100%;text-align:left;border:1px solid #dce3dd;border-left:3px solid var(--success);background:#f3f8f4;border-radius:4px;padding:6px;margin:4px 0;color:var(--text);font-size:11px;line-height:1.4;overflow-wrap:anywhere;cursor:pointer}
    .calendar-entry.unreleased{background:#faf6ed;border-color:#e9dfca;border-left-color:var(--warning)}
    .calendar-entry.schedule-block{background:#eef2fa;border-color:#d6dff0;border-left-color:#526b9b}
    .calendar-entry:hover{filter:brightness(.96)}
    .calendar-entry .calendar-desc{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .calendar-more{font-size:11px;color:var(--muted);margin-top:5px}
    .calendar-agenda{padding:16px 18px}
    .calendar-agenda h3{font-size:16px;margin:0 0 12px}
    .calendar-agenda-item{display:flex;gap:12px;align-items:start;border-bottom:1px solid var(--border);padding:10px 0}
    .calendar-agenda-item:last-child{border:0}
    @media(max-width:900px){.calendar-day{min-height:85px;padding:4px}.calendar-entry{font-size:10px;padding:4px}.calendar-entry .calendar-desc,.calendar-entry .calendar-tech{display:none}}
    @media(max-width:600px){.calendar-day{min-height:58px}.calendar-weekdays div{font-size:10px}.calendar-entry{font-size:10px;line-height:1.2}.calendar-toolbar{padding:12px}}

    @media (max-width: 800px) {
      header {
        padding: 0 16px;
      }

      .brand-section,
      .user-role {
        display: none;
      }

      nav {
        width: 175px;
      }

      main {
        padding: 20px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .schedule-item {
        grid-template-columns: 70px 1fr;
      }

      .schedule-item .schedule-actions {
        grid-column: 2;
      }

      .form-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .app {
        display: block;
      }

      nav {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }

      .nav-label {
        display: none;
      }

      .nav-button {
        width: auto;
        white-space: nowrap;
        margin: 0;
      }

      main {
        padding: 16px;
      }

      .schedule-item {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .schedule-item .schedule-actions {
        grid-column: auto;
      }

      .date-controls strong {
        min-width: 0;
      }
    }

    /* Work-order inline customer and location lookup */
    .wo-lookup{position:relative}
    .wo-results{position:absolute;z-index:25;top:100%;left:0;right:0;max-height:240px;overflow:auto;background:white;border:1px solid var(--border);border-radius:5px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
    .wo-results[hidden],.wo-inline[hidden]{display:none!important}
    .wo-result{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #eee;background:white;cursor:pointer;font-size:13px}
    .wo-result:hover,.wo-result:focus{background:#f1f2f3}
    .wo-inline{margin-top:10px;border:1px solid var(--border);background:#fafafa;padding:14px;border-radius:6px}
    .wo-inline h3{font-size:14px;margin:0 0 12px}
    .wo-inline .form-grid{gap:10px}
    .wo-inline .form-actions{margin-top:12px}
    .wo-selection{margin-top:6px;color:var(--success);font-size:12px}

/* Phone-first communications */
.calls-toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.calls-toolbar input{flex:1;min-width:160px}
.calls-toolbar select{width:auto;min-width:130px}
.calls-list{display:grid;gap:11px}
.call-card{border:1px solid var(--border);border-radius:8px;padding:16px;background:white;min-width:0}
.call-card.overdue{border-left:4px solid #a52a2a}
.call-card-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.call-card h3{font-size:16px;margin:0 0 5px}
.call-card p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.call-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.call-actions a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#e9f2ec;border:1px solid #c6d9cc;color:#245638;border-radius:6px;padding:10px 13px;font-weight:600}
.call-actions button{min-height:40px}
.call-history{border-bottom:1px solid var(--border);padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.call-history:last-child{border:0}
#callOrderResults,#callCustomerResults{position:relative;top:auto;max-height:220px;box-shadow:none;margin-top:4px}
.call-datetime{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.call-datetime input[type=date]{flex:2;min-width:150px}.call-datetime select{flex:0 1 auto;width:auto;min-width:66px}.call-datetime span{font-weight:700}
@media(max-width:600px){.call-datetime input[type=date]{width:100%;flex:auto}.call-datetime select{flex:1}.call-actions>*{flex:1}.calls-toolbar>*{width:100%!important}.call-card{padding:13px}.calls-form-actions{flex-direction:column}.calls-form-actions button{width:100%}}
  </style>

</head>

<body>

<header>
  <div class="brand">
    <div class="brand-name">SIGNATURE</div>
    <div class="brand-section">DISPATCH</div>
  </div>

  <div class="user-area">
    <div class="user-info">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-role" id="userRole">Loading...</div>
    </div>


<button class="sign-out" id="signOutButton">
  Sign Out
</button>


  </div>
</header>

<div class="app">

  <nav>
    <div class="nav-label">Dispatch</div>


<button class="nav-button active" data-page="schedule">
  Schedule
</button>

<button class="nav-button" data-page="calendar">Calendar</button>

<button class="nav-button" data-page="work-orders">
  Work Orders
</button>

<button class="nav-button" data-page="schedule-blocks">Schedule Blocks</button>
<button class="nav-button" data-page="calls">Calls</button>

<button class="nav-button" data-page="customers">
  Customers
</button>

<button class="nav-button" data-page="locations">
  Locations
</button>

<button class="nav-button" data-page="technicians">
  Technicians
</button>

<button class="nav-button" data-page="parts">
  Parts
</button>

<button class="nav-button" data-page="notes">
  Notes
</button>

<button class="nav-button" data-page="photos">
  Photos
</button>


  </nav>

  <main id="mainContent">
    <div class="empty">
      Loading Dispatch...
    </div>
  </main>

</div>

<div id="message"></div>

<script>

  const SUPABASE_URL =
    "https://zpawrfdfutswbvhlwvqf.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_NGa3aWmkMCXm45Hf4m-RYQ_QitmMq68";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let currentUser = null;
  let currentProfile = null;
  let currentDate = new Date();
  let currentWorkOrderFilter = "all";
  let currentWorkOrderShop = "all";
  let calendarShop = "all";
  let shopDirectory = [];
  let calendarMonth = new Date(new Date().getFullYear(),new Date().getMonth(),1);
  let calendarFilter = "all";
  let calendarSelectedDay = new Date().getDate();
  let calendarRequest = 0;
  let currentBlockFilter = "active";
  let workOrderSort = { field: "created_at", ascending: false };
  const dispatchSearch = { "work-orders": "", parts: "", notes: "", photos: "",
    customers: "", locations: "", technicians: "" };


  // ============================================
  // HELPERS
  // ============================================

  function showMessage(text, error = false) {

    const element =
      document.getElementById("message");

    element.textContent = text;
    element.className = error ? "error" : "";
    element.style.display = "block";

    setTimeout(() => {
      element.style.display = "none";
    }, 4000);
  }


  function formatDate(date) {

    return date.toLocaleDateString(
      "en-US",
      {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function customerName(customer) {

    if (!customer) {
      return "Customer";
    }

    if (customer.company_name) {
      return customer.company_name;
    }

    return (
      `${customer.first_name || ""} ${customer.last_name || ""}`
        .trim()
      || "Unnamed Customer"
    );
  }


  // Show the business and its contact person together when both exist.
  function customerDisplayHtml(customer) {
    const business = String(customer?.company_name || "").trim();
    const contact = [customer?.first_name, customer?.last_name]
      .filter(Boolean).join(" ").trim();
    const primary = business || contact || "Unnamed Customer";
    return `<strong>${escapeHtml(primary)}</strong>` +
      (business && contact
        ? `<div class="small-muted">Contact: ${escapeHtml(contact)}</div>`
        : "");
  }

  function customerSelectionName(customer) {
    const business = String(customer?.company_name || "").trim();
    const contact = [customer?.first_name, customer?.last_name]
      .filter(Boolean).join(" ").trim();
    return business && contact ? `${business} — ${contact}`
      : business || contact || "Unnamed Customer";
  }

  function technicianName(technician) {

    if (!technician) {
      return "Unassigned";
    }

    return (
      `${technician.first_name || ""} ${technician.last_name || ""}`
        .trim()
      || "Technician"
    );
  }


  // Multiple technician assignments are stored in service_call_technicians.
  async function fetchAssignmentMap(calls) {
    const ids = [...new Set((calls || []).map(c => c.id).filter(Boolean))];
    const map = new Map(ids.map(id => [id, []]));
    if (!ids.length) return map;
    const { data, error } = await db.from("service_call_technicians")
      .select("service_call_id,technician_id,technicians(first_name,last_name)")
      .in("service_call_id", ids);
    if (error) throw error;
    (data || []).forEach(a => map.get(a.service_call_id)?.push(a));
    return map;
  }

  function assignedNames(call) {
    if (Array.isArray(call._assignments)) {
      return call._assignments.length
        ? call._assignments.map(a => technicianName(a.technicians)).join(", ")
        : "Unassigned";
    }
    return technicianName(call.technicians);
  }

  async function ensureShops() {
    const {data,error} = await db.from("shops").select("id,name").order("name");
    if(error) throw error;
    shopDirectory = data || [];
    return shopDirectory;
  }
  function shopName(id) {
    return shopDirectory.find(s=>String(s.id)===String(id))?.name || "Unassigned";
  }

  function directorySearchText(record, page) {
    let values = [];
    if (page === "customers") {
      values = [record.first_name, record.last_name,
        `${record.first_name || ""} ${record.last_name || ""}`.trim(),
        record.company_name, record.phone, record.email];
    } else if (page === "locations") {
      const customer = record.customers || {};
      values = [record.address, record.city, record.state, record.zip,
        customer.first_name, customer.last_name,
        `${customer.first_name || ""} ${customer.last_name || ""}`.trim(),
        customer.company_name, customerName(customer)];
    } else if (page === "technicians") {
      values = [record.first_name, record.last_name,
        technicianName(record), record.title, record.phone, record.email,
        record.active ? "active" : "inactive"];
    }
    return values.map(value => String(value ?? "")).join(" ").toLowerCase();

  function applyDispatchSearch(page, bodyId) {
    const body = document.getElementById(bodyId);
    if (!body || !body._dispatchRecords) return;
    const terms = (dispatchSearch[page] || "").trim().toLowerCase().split(/\\s+/).filter(Boolean);
    const matching = body._dispatchRecords.filter(item =>
      terms.every(term => item.search.includes(term)) &&
      (page !== "work-orders" || currentWorkOrderShop === "all" || String(item.record.shop_id) === currentWorkOrderShop)
    );
    if (page === "work-orders") {
      matching.sort((a, b) => {
        const field = workOrderSort.field;
        const av = a.record[field];
        const bv = b.record[field];
        // Unscheduled orders always follow scheduled orders.
        if (field === "scheduled_at") {
          if (!av && !bv) return compareWorkOrderDates(a.record, b.record, "created_at", false);
          if (!av) return 1;
          if (!bv) return -1;
        }
        return compareWorkOrderDates(a.record, b.record, field, workOrderSort.ascending);
      });
    }
    body.innerHTML = matching.length
      ? matching.map(item => item.html).join("")
      : `<tr><td colspan="${page === "work-orders" ? 11 : page === "parts" ? 8 : page === "notes" ? 6 : page === "customers" ? 4 : 6}">
          <div class="empty">No matching records.</div></td></tr>`;
    const count = document.getElementById("dispatchSearchCount");
    if (count) count.textContent = `${matching.length} of ${body._dispatchRecords.length} records shown`;
  }

  function compareWorkOrderDates(a, b, field, ascending) {
    const aTime = Date.parse(a[field] || "") || 0;
    const bTime = Date.parse(b[field] || "") || 0;
    if (aTime !== bTime) return ascending ? aTime - bTime : bTime - aTime;
    return String(a.id || "").localeCompare(String(b.id || ""));
  }

  function updateWorkOrderSortHeaders() {
    document.querySelectorAll("[data-work-sort]").forEach(button => {
      const active = button.dataset.workSort === workOrderSort.field;
      const label = button.dataset.workSort === "created_at" ? "Work Order" : "Scheduled";
      button.textContent = label + (active ? (workOrderSort.ascending ? " ↑" : " ↓") : " ↕");
      button.setAttribute("aria-sort", active ? (workOrderSort.ascending ? "ascending" : "descending") : "none");
    });
  }

  function changeWorkOrderSort(field) {
    if (workOrderSort.field === field) {
      workOrderSort.ascending = !workOrderSort.ascending;
    } else {
      workOrderSort = { field, ascending: true };
    }
    updateWorkOrderSortHeaders();
    applyDispatchSearch("work-orders", "workOrdersBody");
  }

    function toggle() { document.querySelectorAll(".bill-standard").forEach(el => el.style.display = method.value === "quoted" ? "none" : "flex"); }

      const valueOrNull = id => document.getElementById(id).value.trim() || null;
      const hoursRaw = valueOrNull("billHours"), countRaw = valueOrNull("billCount");

      const trip = valueOrNull("billTrip");
      const payload = { billing_method };
      if (billing_method === "standard") {
        Object.assign(payload, {service_classification:valueOrNull("billClassification"),
          labor_hours:hours, labor_technician_count:count,
          trip_charge:trip === null ? null : trip === "yes"});
      }
      button.disabled = true;
      try {
        const {error} = await db.from("service_calls").update(payload).eq("id",call.id);
        if (error) throw error;
        showMessage("Billing details saved.");
        await showWorkOrderDetail(call.id);
      } catch (error) { console.error(error); showMessage(error.message || "Could not save billing details.",true); button.disabled = false; }
    });
  }

      0,
      0,
      0

      59,
      59,

      .from("service_calls")
      .select(`

  function calendarDateKey(value){
    const d = new Date(value);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  async function showCalendar(){
    setActiveNav('calendar');
    try { await ensureShops(); } catch(e) { showMessage('Could not load shops: '+e.message,true); return; }
    const request=++calendarRequest;
    const main=document.getElementById('mainContent');
    main.innerHTML=`<div class="page-head"><div><h1>Work Calendar</h1><p>Scheduled work orders and schedule blocks. Select an entry to view details.</p></div></div>
      <div class="card"><div class="calendar-toolbar">
      <div class="date-controls"><button id="calendarPrev" type="button" aria-label="Previous month">‹</button><strong>${escapeHtml(calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'}))}</strong><button id="calendarNext" type="button" aria-label="Next month">›</button><button id="calendarToday" type="button">Today</button></div>
      <div class="filter-bar" style="border:0;padding:0;background:transparent">
      ${[['all','All'],['released','Work Orders Released'],['unreleased','Work Orders Unreleased']].map(([value,label])=>`<button type="button" class="filter-button ${calendarFilter===value?'active':''}" data-calendar-filter="${value}">${label}</button>`).join('')}</div></div>
      ${shopFilterHtml('calendarShopFilter',calendarShop)}
      <div class="calendar-weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div>
      <div class="calendar-grid" id="calendarGrid"><div class="empty" style="grid-column:1/-1">Loading calendar...</div></div>
      <div id="calendarAgenda" class="calendar-agenda"></div></div>`;
    document.getElementById('calendarPrev').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);calendarSelectedDay=1;showCalendar()};
    document.getElementById('calendarNext').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);calendarSelectedDay=1;showCalendar()};
    document.getElementById('calendarToday').onclick=()=>{const now=new Date();calendarMonth=new Date(now.getFullYear(),now.getMonth(),1);calendarSelectedDay=now.getDate();showCalendar()};
    main.querySelectorAll('[data-calendar-filter]').forEach(b=>b.onclick=()=>{calendarFilter=b.dataset.calendarFilter;showCalendar()});
    document.getElementById('calendarShopFilter').onchange=e=>{calendarShop=e.target.value;showCalendar()};
    const from=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);
    const to=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);
    const [ordersResult,blocksResult]=await Promise.all([
      db.from('service_calls')
        .select('id,shop_id,work_order_number,description,scheduled_at,released,status,customers(first_name,last_name,company_name),technicians!service_calls_assigned_technician_id_fkey(first_name,last_name)')
        .gte('scheduled_at',from.toISOString()).lt('scheduled_at',to.toISOString())
        .order('scheduled_at',{ascending:true}),
      db.from('schedule_blocks')
        .select('id,title,block_type,description,location,starts_at,ends_at,all_day,status,released,schedule_block_technicians(technician_id,technicians(first_name,last_name))')
        .lt('starts_at',to.toISOString()).gt('ends_at',from.toISOString())
        .order('starts_at',{ascending:true})
    ]);
    if(request!==calendarRequest || !document.getElementById('calendarGrid'))return;
    const grid=document.getElementById('calendarGrid');
    if(ordersResult.error){console.error(ordersResult.error);grid.innerHTML=`<div class="empty" style="grid-column:1/-1">Unable to load calendar: ${escapeHtml(ordersResult.error.message)}</div>`;return}
    let calls=ordersResult.data||[];
    try{
      const assignments=await fetchAssignmentMap(calls);
      calls.forEach(call=>call._assignments=assignments.get(call.id)||[]);
    }catch(e){console.warn('Calendar assignments unavailable',e);showMessage('Calendar loaded, but technician assignments could not be retrieved.',true)}
    if(request!==calendarRequest || !document.getElementById('calendarGrid'))return;
    calls=calls.filter(c=>(calendarShop==='all'||String(c.shop_id)===calendarShop) && (calendarFilter==='all'||(calendarFilter==='released'?c.released===true:c.released!==true)));
    // Schedule Blocks have no shop field. Keep them visible under every shop filter.
    // Release filters retain their original work-order meaning; blocks remain visible.
    let blocks=[];
    if(blocksResult.error){console.error(blocksResult.error);showMessage('Schedule blocks unavailable: '+blocksResult.error.message,true)}
    else blocks=(blocksResult.data||[]).filter(b=>!['cancelled','declined'].includes(String(b.status||'').toLowerCase()));
    const byDay=new Map();
    const add=(key,item)=>{if(!byDay.has(key))byDay.set(key,[]);byDay.get(key).push(item)};
    for(const c of calls)add(calendarDateKey(c.scheduled_at),{kind:'order',time:new Date(c.scheduled_at),data:c});
    // Add multi-day blocks to every date they overlap, not just their start date.
    for(const b of blocks){
      const start=new Date(b.starts_at),end=new Date(b.ends_at);
      if(!Number.isFinite(start.getTime())||!Number.isFinite(end.getTime()))continue;
      let day=new Date(Math.max(from.getTime(),new Date(start.getFullYear(),start.getMonth(),start.getDate()).getTime()));
      for(;day<to && day<end;day.setDate(day.getDate()+1)){
        const next=new Date(day.getFullYear(),day.getMonth(),day.getDate()+1);
        if(start<next && end>day)add(calendarDateKey(day),{kind:'block',time:start,data:b});
      }
    }
    for(const items of byDay.values())items.sort((a,b)=>a.time-b.time || (a.kind==='block'?-1:1));
    const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const count=new Date(year,month+1,0).getDate();
    const total=Math.ceil((firstDay+count)/7)*7;
    const now=new Date();
    const timeLabel=item=>item.kind==='block'&&item.data.all_day?'All day':new Date(item.time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const itemTitle=item=>item.kind==='block'?item.data.title:[shopName(item.data.shop_id),assignedNames(item.data),customerName(item.data.customers)].join(' | ');
    const itemDescription=item=>item.kind==='block'?(item.data.description||statusLabel(item.data.block_type)):descriptionPreview(item.data.description,45);
    const itemPeople=item=>item.kind==='block'?blockTechnicians(item.data):assignedNames(item.data);
    const itemAttribute=item=>item.kind==='block'?`data-calendar-block="${escapeAttribute(item.data.id)}"`:`data-calendar-order="${escapeAttribute(item.data.id)}"`;
    grid.innerHTML=Array.from({length:total},(_,index)=>{
      const day=index-firstDay+1;
      if(day<1||day>count)return `<div class="calendar-day outside" aria-hidden="true"></div>`;
      const key=calendarDateKey(new Date(year,month,day));
      const items=byDay.get(key)||[];
      const isToday=year===now.getFullYear()&&month===now.getMonth()&&day===now.getDate();
      return `<div class="calendar-day ${isToday?'today':''}">
        <button type="button" data-calendar-day="${day}" class="row-button calendar-number" aria-label="Show ${escapeAttribute(key)} scheduled entries">${day}</button>
        ${items.slice(0,3).map(item=>`<button type="button" class="calendar-entry ${item.kind==='block'?'schedule-block':item.data.released?'':'unreleased'}" ${itemAttribute(item)} title="${escapeAttribute(`${item.kind==='block'?'Schedule Block':'Work Order'} | ${itemTitle(item)} | ${itemDescription(item)} | ${itemPeople(item)}`)}"><strong>${escapeHtml(timeLabel(item))} · ${escapeHtml(itemTitle(item))}</strong><span class="calendar-desc">${escapeHtml(itemDescription(item))}</span><span class="calendar-tech">${escapeHtml(itemPeople(item))}</span></button>`).join('')}
        ${items.length>3?`<button type="button" class="row-button calendar-more" data-calendar-day="${day}">+${items.length-3} more</button>`:''}</div>`;
    }).join('');
    function showAgenda(){
      const key=calendarDateKey(new Date(year,month,calendarSelectedDay));
      const items=byDay.get(key)||[];
      const agenda=document.getElementById('calendarAgenda');
      if(!agenda)return;
      agenda.innerHTML=`<h3>${escapeHtml(new Date(year,month,calendarSelectedDay).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))} · ${items.length} scheduled entr${items.length===1?'y':'ies'}</h3>`+
        (items.length?items.map(item=>`<div class="calendar-agenda-item"><div style="min-width:85px"><strong>${escapeHtml(timeLabel(item))}</strong></div><div style="flex:1;min-width:0"><strong>${escapeHtml(itemTitle(item))}</strong> · ${item.kind==='block'?'Schedule Block':escapeHtml(workOrderLabel(item.data))}<div>${escapeHtml(itemDescription(item))}</div><div class="small-muted">${escapeHtml(itemPeople(item))} · ${item.kind==='block'?escapeHtml(statusLabel(item.data.status)):`${item.data.released?'Released':'Not Released'} · ${escapeHtml(statusLabel(item.data.status))}`}</div></div><button type="button" class="row-button" ${itemAttribute(item)}>Open</button></div>`).join(''):'<p class="small-muted">No scheduled work orders or schedule blocks for this day.</p>');
    }
    function openCalendarEntry(event){
      const block=event.target.closest('[data-calendar-block]');
      if(block){showScheduleBlockDetail(block.dataset.calendarBlock);return true}
      const order=event.target.closest('[data-calendar-order]');
      if(order){showWorkOrderDetail(order.dataset.calendarOrder);return true}
      return false;
    }
    grid.onclick=e=>{
      if(openCalendarEntry(e))return;
      const day=e.target.closest('[data-calendar-day]');
      if(day){calendarSelectedDay=Number(day.dataset.calendarDay);showAgenda()}
    };
    document.getElementById('calendarAgenda').onclick=openCalendarEntry;
    if(calendarSelectedDay>count)calendarSelectedDay=count;
    showAgenda();
  }

  async function loadWorkOrders() {

    const body =
      document.getElementById("workOrdersBody");

    let query =
      db
        .from("service_calls")
        .select(`
          *,
          customers (
            first_name,
            last_name,
            company_name
          ),
          locations (
            address,
            city,
            state
          ),
          technicians!service_calls_assigned_technician_id_fkey (
            first_name,
            last_name
          )
        `)
        .order("created_at", { ascending: false });


    if (
      currentWorkOrderFilter === "service" ||
      currentWorkOrderFilter === "install" ||
      currentWorkOrderFilter === "checkout"
    ) {

      query =
        query.eq(
          "work_type",
          currentWorkOrderFilter
        );
    }


    if (
      currentWorkOrderFilter === "in_progress"
    ) {

      query =
        query.eq(
          "status",
          "in_progress"
        );
    }


    if (
      currentWorkOrderFilter === "completed"
    ) {

      query =
        query.eq(
          "status",
          "completed"
        );
    }


    if (
      currentWorkOrderFilter === "cancelled"
    ) {

      query =
        query.eq(
          "status",
          "cancelled"
        );
    }


    if (
      currentWorkOrderFilter === "upcoming"
    ) {

      query =
        query
          .gte(
            "scheduled_at",
            new Date().toISOString()
          )
          .neq(
            "status",
            "completed"
          )
          .neq(
            "status",
            "cancelled"
          );
    }


    const {
      data,
      error
    } = await query;


    if (error) {

      console.error(error);

      body.innerHTML = `
        <tr>
          <td colspan="11">

            <div class="empty">
              Unable to load work orders.<br><br>
              ${escapeHtml(error.message)}
            </div>

          </td>
        </tr>
      `;

      return;
    }


    if (!data || data.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="11">

            <div class="empty">
              No work orders match this view.
            </div>

          </td>
        </tr>
      `;

      return;
    }


    try {
      const assignments = await fetchAssignmentMap(data);
      data.forEach(call => call._assignments = assignments.get(call.id) || []);
    } catch (e) {
      console.error(e);
      showMessage("Technician assignments unavailable; showing existing work orders.", true);
    }

    // Communication status is calculated from existing tasks and history; no Work Order fields are changed.
    const communicationSummary = new Map();
    try {
      const ids = data.map(c => c.id);
      for (let i = 0; i < ids.length; i += 150) {
        const chunk = ids.slice(i, i + 150);
        const [tasksResult, historyResult] = await Promise.all([
          db.from('communication_tasks').select('service_call_id,status,scheduled_at,purpose').in('service_call_id',chunk).eq('status','pending'),
          db.from('communications').select('service_call_id,occurred_at,outcome,direction,communication_type').in('service_call_id',chunk).order('occurred_at',{ascending:false})
        ]);
        if (tasksResult.error) throw tasksResult.error;
        if (historyResult.error) throw historyResult.error;
        for (const task of tasksResult.data || []) {
          if (!communicationSummary.has(task.service_call_id)) communicationSummary.set(task.service_call_id,{tasks:[],latest:null});
          communicationSummary.get(task.service_call_id).tasks.push(task);
        }
        for (const entry of historyResult.data || []) {
          if (!communicationSummary.has(entry.service_call_id)) communicationSummary.set(entry.service_call_id,{tasks:[],latest:null});
          const summary=communicationSummary.get(entry.service_call_id);
          if (!summary.latest || new Date(entry.occurred_at)>new Date(summary.latest.occurred_at)) summary.latest=entry;
        }
      }
    } catch (error) {
      console.warn('Communication status unavailable',error);
    }
    const nowForCalls = new Date();
    const communicationLabel = id => {
      const info=communicationSummary.get(id);
      if (!info) return 'No communications';
      if (info.tasks.length) {
        const overdue=info.tasks.some(t=>t.scheduled_at && new Date(t.scheduled_at)<nowForCalls);
        return overdue ? 'Overdue callback' : 'Call scheduled';
      }
      if (info.latest) return 'Last: '+statusLabel(info.latest.outcome||info.latest.communication_type||'Contacted');
      return 'No communications';
    };

    body._dispatchRecords =
      data.map(call => {

        const scheduled =
          call.scheduled_at
            ? new Date(
                call.scheduled_at
              ).toLocaleString(
                "en-US",
                {
                  month: "short",
                  day: "numeric",
                  year: "numeric",
                  hour: "numeric",
                  minute: "2-digit"
                }
              )
            : "Not scheduled";


        const communicationState = communicationLabel(call.id);


        const search = dispatchSearchText(call, [
          assignedNames(call), call.status,
          call.locations?.city, call.locations?.state, communicationState
        ]);
        const html = `

          <tr>

            <td><strong>${escapeHtml(workOrderLabel(call))}</strong></td>
            <td>
              <span class="type-badge">
                ${escapeHtml(
                  workTypeLabel(call.work_type)
                )}
              </span>
            </td>

            <td>${escapeHtml(shopName(call.shop_id))}</td>
            <td>
              ${escapeHtml(
                customerName(call.customers)
              )}
            </td>

            <td title="${escapeAttribute(call.description || "")}">
              ${escapeHtml(descriptionPreview(call.description))}
            </td>
            <td>
              <button type="button" class="row-button" onclick="showWorkOrderDetail('${call.id}')" title="Open Work Order communications">${escapeHtml(communicationState)}</button>
            </td>

            <td>
              ${escapeHtml(scheduled)}
            </td>

            <td>
              ${escapeHtml(
                assignedNames(call)
              )}
            </td>

            <td>
              <span class="status">
                ${escapeHtml(
                  statusLabel(call.status)
                )}
              </span>
            </td>

            <td>

              <span
                class="release-badge ${call.released ? "released" : "unreleased"}"
              >
                ${call.released ? "Released" : "Not Released"}
              </span>

            </td>

            <td>

              <button
                class="row-button"
                onclick="showWorkOrderDetail('${call.id}')"
              >
                Open
              </button>

            </td>

          </tr>
        `;
        return { html, search, record: call };

      });
    applyDispatchSearch("work-orders", "workOrdersBody");
  }

  async function loadWorkOrderRelated(id) {
    const queries = await Promise.all([
      db.from("parts").select("*").eq("service_call_id",id).order("created_at",{ascending:false}),
      db.from("service_call_notes").select("*").eq("service_call_id",id).order("created_at",{ascending:false}),
      db.from("service_call_photos").select("*").eq("service_call_id",id).order("created_at",{ascending:false})
    ]);
    const [parts,notes,photos]=queries;
    const elPart=document.getElementById("detailParts");
    const elNote=document.getElementById("detailNotes");
    const elPhoto=document.getElementById("detailPhotos");
    if (!elPart || !elNote || !elPhoto) return;
    const buttons=(kind,item)=>`<button class="row-button" onclick="show${kind}Form('${item.id}', '${id}')">Edit</button>
      <button class="danger" onclick="deleteRelatedRecord('${kind}','${item.id}','${id}')">Delete</button>`;
    const render=(el,result,headings,rows,empty)=>{
      if(result.error){el.textContent="Unable to load: "+result.error.message;return;}
      el.innerHTML=result.data.length
        ? `<div class="table-wrap"><table><thead><tr>${headings.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
        : `<span class="small-muted">${empty}</span>`;
    };
    render(elPart,parts,["Part Number","Description","Quantity","Unit Price",""],(parts.data||[]).map(p=>
      `<tr><td>${escapeHtml(p.part_number||"—")}</td><td>${escapeHtml(p.description||"—")}</td>
       <td>${escapeHtml(p.quantity??0)}</td><td>$${escapeHtml(Number(p.unit_cost||0).toFixed(2))}</td>
       <td>${buttons("Part",p)}</td></tr>`),"No parts recorded.");
    render(elNote,notes,["Note","Created",""],(notes.data||[]).map(n=>
      `<tr><td>${escapeHtml(n.note||"")}</td><td>${escapeHtml(n.created_at?new Date(n.created_at).toLocaleString():"—")}</td>
       <td>${n.is_completion_note ? '<span class="small-muted">Completion note</span>' : buttons("Note",n)}</td></tr>`),"No notes recorded.");
    if(photos.error){elPhoto.textContent="Unable to load: "+photos.error.message;return;}
    const photoRows=await Promise.all((photos.data||[]).map(async p=>{
      let url="";
      if(p.file_path){
        if(/^https?:\/\//i.test(p.file_path)) url=p.file_path;
        else {
          const signed=await db.storage.from("dispatch-photos").createSignedUrl(p.file_path,3600);
          if(signed.error)console.error("Photo access:",signed.error);
          else url=signed.data.signedUrl;
        }
      }
      return `<tr><td>${url?`<a href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">
        <img class="photo-preview" src="${escapeAttribute(url)}" alt="${escapeAttribute(p.caption||"Photo")}"></a>`:"—"}</td>
        <td>${escapeHtml(p.caption||"—")}</td><td>${buttons("Photo",p)}</td></tr>`;
    }));

  async function deleteRelatedRecord(kind,id,workOrderId) {
    if(!confirmDelete(`Delete this ${kind.toLowerCase()}?`))return;
    const table={Part:"parts",Note:"service_call_notes",Photo:"service_call_photos"}[kind];
    if(!table)return;
    if(kind==="Photo"){
      const {data,error}=await db.from(table).select("file_path").eq("id",id).single();
      if(error)return showMessage(error.message,true);
      if(data.file_path && !/^https?:\/\//i.test(data.file_path)){
        const {error:storageError}=await db.storage.from("dispatch-photos").remove([data.file_path]);
        if(storageError)return showMessage(storageError.message,true);
      }
    }
    const {error}=await db.from(table).delete().eq("id",id);
    if(error)return showMessage(error.message,true);
    showMessage(kind+" deleted.");
    await loadWorkOrderRelated(workOrderId);
  }

function phoneDraftRow(containerId, number = '', type = '') {

    phone_type: row.querySelector('.draft-phone-type').value.trim() || 'Main'
  })).filter(item => item.phone_number);

async function savePhoneDrafts(customerId, containerId) {

}
async function loadCustomerDirectoryPhones(customerId) {
  const list = document.getElementById('customerDirectoryPhoneList');
  if (!list || !customerId) return;
  const {data,error} = await db.from('customer_phone_numbers')
    .select('id,phone_number,phone_type').eq('customer_id',customerId).order('created_at');
  if (!document.getElementById('customerDirectoryPhoneList')) return;
  if (error) { list.textContent = 'Could not load phone numbers: ' + error.message; return; }
  list.replaceChildren();
  if (!data?.length) list.textContent = 'No additional numbers saved.';
  for (const phone of data || []) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee';
    const label = document.createElement('span');
    label.textContent = `${phone.phone_number} · ${phone.phone_type || 'Main'}`;
    const remove = document.createElement('button');
    remove.type='button'; remove.className='row-button'; remove.textContent='Remove';
    remove.onclick = async () => {
      if (!confirmDelete('Remove this customer phone number?')) return;
      remove.disabled=true;
      const {error} = await db.from('customer_phone_numbers').delete().eq('id',phone.id);
      if (error) { showMessage(error.message,true);remove.disabled=false;return; }
      await loadCustomerDirectoryPhones(customerId);
    };
    row.append(label,remove);list.appendChild(row);
  }
}

let woPhoneLoadedCustomer = null;
let woPhoneRequest = 0;
async function refreshWorkOrderPhones(force = false) {
  const panel = document.getElementById('woPhonePanel');
  const customer = document.getElementById('customer');
  if (!panel || !customer) return;
  const id = customer.value;
  panel.hidden = !id;
  if (!id) { woPhoneLoadedCustomer = null; ++woPhoneRequest; return; }
  if (!force && woPhoneLoadedCustomer === id) return;
  woPhoneLoadedCustomer = id;
  const request = ++woPhoneRequest;
  const list = document.getElementById('woPhoneList');
  const entry = document.getElementById('woPhoneEntry');
  entry.hidden = true;
  list.textContent = 'Loading phone numbers...';
  const { data, error } = await db.from('customer_phone_numbers')
    .select('id,phone_number,phone_type').eq('customer_id', id).order('created_at');
  if (request !== woPhoneRequest || document.getElementById('customer')?.value !== id) return;
  if (error) { list.textContent = 'Could not load phone numbers: ' + error.message; return; }
  list.replaceChildren();
  if (!data?.length) list.textContent = 'No additional phone numbers saved.';
  for (const phone of data || []) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e5e5e5';
    const label = document.createElement('span');
    label.textContent = `${phone.phone_number} · ${phone.phone_type || 'Main'}`;
    const remove = document.createElement('button');
    remove.type = 'button'; remove.className = 'row-button'; remove.textContent = 'Remove';
    remove.onclick = async () => {
      if (!confirmDelete('Remove this phone number from the customer?')) return;
      remove.disabled = true;
      const { error: deleteError } = await db.from('customer_phone_numbers').delete().eq('id', phone.id);
      if (deleteError) { showMessage(deleteError.message, true); remove.disabled = false; return; }
      await refreshWorkOrderPhones(true);
    };
    row.append(label, remove); list.appendChild(row);
  }
}
function initializeWorkOrderPhoneEntry() {
  document.getElementById('woAddPhone').onclick = () => {
    document.getElementById('woPhoneEntry').hidden = false;
    document.getElementById('woPhoneNumber').focus();
  };
  document.getElementById('woCancelPhone').onclick = () => {
    document.getElementById('woPhoneEntry').hidden = true;
  };
  document.getElementById('woSavePhone').onclick = async () => {
    const customerId = document.getElementById('customer').value;
    const number = document.getElementById('woPhoneNumber').value.trim();
    const type = document.getElementById('woPhoneType').value.trim() || 'Main';
    if (!customerId || !number) { showMessage('Select a customer and enter a phone number.', true); return; }
    const button = document.getElementById('woSavePhone'); button.disabled = true;
    try {
      const { error } = await db.from('customer_phone_numbers').insert({ customer_id: customerId, phone_number: number, phone_type: type });
      if (error) throw error;
      document.getElementById('woPhoneNumber').value = '';
      document.getElementById('woPhoneType').value = '';
      await refreshWorkOrderPhones(true);
      showMessage('Phone number saved to customer.');
    } catch (error) { console.error(error); showMessage(error.message || 'Could not save phone number.', true); }
    finally { button.disabled = false; }
  };
}
async function initializeWorkOrderLookups() {
  const customer=document.getElementById('customer'), location=document.getElementById('location');
  const cs=document.getElementById('customerSearch'),ls=document.getElementById('locationSearch');
  const cr=document.getElementById('customerResults'),lr=document.getElementById('locationResults');
  const cp=document.getElementById('newCustomerPanel'),lp=document.getElementById('newLocationPanel');
  function hideResults(){cr.hidden=true;lr.hidden=true;}
  function render(input,select,results,type){
    const q=input.value.trim().toLowerCase();
    const opts=[...select.options].filter(o=>o.value && (!q||o.textContent.toLowerCase().includes(q)));
    results.replaceChildren();
    opts.slice(0,35).forEach(o=>{
      const b=document.createElement('button');b.type='button';b.className='wo-result';b.textContent=o.textContent;
      b.onclick=async()=>{
        select.value=o.value;input.value=o.textContent.trim();hideResults();
        if(type==='customer'){
          cp.hidden=true;lp.hidden=true;
          await loadLocationsForSelectedCustomer();
        }else lp.hidden=true;
        syncWorkOrderLookupDisplays();
      };
      results.appendChild(b);
    });
    const add=document.createElement('button');add.type='button';add.className='wo-result';
    add.textContent=type==='customer'?'+ Add new customer':'+ Add new location';
    add.onclick=()=>{
      hideResults();
      if(type==='customer'){
        cp.hidden=false;
        const name=cs.value.trim();
        if(name && !document.getElementById('woCustomerCompany').value && !document.getElementById('woCustomerFirst').value){
          const parts=name.split(/\s+/);
          if(parts.length===1)document.getElementById('woCustomerCompany').value=name;
          else {document.getElementById('woCustomerFirst').value=parts.shift();document.getElementById('woCustomerLast').value=parts.join(' ');}
        }
        document.getElementById('woCustomerFirst').focus();
      }else{
        lp.hidden=false;
        document.getElementById('woLocationAddress').value=ls.value.trim();
        document.getElementById('woLocationAddress').focus();
      }
    };
    results.appendChild(add);results.hidden=false;
  }
  cs.addEventListener('focus',()=>render(cs,customer,cr,'customer'));
  cs.addEventListener('input',()=>{
    customer.value='';location.innerHTML='<option value="">Select a customer first</option>';
    ls.value='';ls.disabled=true;cp.hidden=true;lp.hidden=true;
    document.getElementById('customerSelection').textContent='Select a matching customer below or add a new one';
    document.getElementById('locationSelection').textContent='';
    render(cs,customer,cr,'customer');
  });
  ls.addEventListener('focus',()=>{if(customer.value)render(ls,location,lr,'location')});
  ls.addEventListener('input',()=>{
    location.value='';lp.hidden=true;
    document.getElementById('locationSelection').textContent='Select a matching location below or add a new one';
    if(customer.value)render(ls,location,lr,'location');
  });
  document.addEventListener('click',e=>{
    if(!cs.closest('.wo-lookup')?.contains(e.target))cr.hidden=true;
    if(!ls.closest('.wo-lookup')?.contains(e.target))lr.hidden=true;
  },{signal:(()=>{const controller=new AbortController();
    // The document listener is removed automatically when a subsequent form is opened.
    const old=window._woLookupController; if(old)old.abort();window._woLookupController=controller;
    return controller.signal;})()});
  document.getElementById('woCancelCustomer').onclick=()=>{cp.hidden=true;syncWorkOrderLookupDisplays()};
  document.getElementById('woCancelLocation').onclick=()=>{lp.hidden=true;syncWorkOrderLookupDisplays()};
  document.getElementById('woNewCustomerAddPhone').onclick=()=>phoneDraftRow('woNewCustomerPhones');
  document.getElementById('woSaveCustomer').onclick=async()=>{
    const val=id=>document.getElementById(id).value.trim();
    const payload={first_name:val('woCustomerFirst'),last_name:val('woCustomerLast'),company_name:val('woCustomerCompany'),phone:val('woCustomerPhone'),email:val('woCustomerEmail'),notes:val('woCustomerNotes')};
    if(!payload.first_name&&!payload.last_name&&!payload.company_name){showMessage('Enter a customer name or company.',true);return;}
    const btn=document.getElementById('woSaveCustomer');btn.disabled=true;

async function saveWorkOrder(
event,
existingId
) {


event.preventDefault();

const customerId =
  document.getElementById("customer").value;
const shopId = document.getElementById("workOrderShop").value;
if (!shopId) { showMessage("Select a shop.",true); return; }

const locationId =
  document.getElementById("location").value;

const technicianIds = [...document.querySelectorAll(".technician-choice:checked")]
  .map(c => c.value);
const technicianId = technicianIds[0] || null;
const billingMethod = document.getElementById("billingMethod").value;
const leadTechnicianId = technicianIds.length === 1
  ? technicianIds[0]
  : technicianIds.length > 1 ? document.getElementById("leadTechnician").value : null;
if (technicianIds.length > 1 && !leadTechnicianId) {
  showMessage("Select a lead technician when assigning two or more technicians.", true);
  return;
}

const workType =
  document.getElementById("workType").value;

const scheduledAt =
  document.getElementById("scheduledAt").value;

const priority =
  document.getElementById("priority").value;

const status =
  document.getElementById("status").value;

const released =
  document.getElementById("released").checked;

const description =
  document.getElementById("description")
    .value
    .trim();

if (!customerId || !locationId) {

  showMessage(
    "Customer and location are required.",
    true
  );

  return;
}

const payload = {
  shop_id: Number(shopId),

  customer_id:
    customerId,

  locations_id:
    locationId,

  assigned_technician_id:
    technicianId,

  work_type:
    workType,

  billing_method: billingMethod,
  // Lead is saved after technician assignments have been synchronized.

  released:
    released,

  status:
    status,

  priority:
    priority,

  description:
    description,

  scheduled_at:
    scheduledAt
      ? new Date(
          scheduledAt
        ).toISOString()
      : null
};


// Keep the legacy primary technician field populated for older pages during migration.
// Assignment rows are the authoritative multi-technician list.
let workOrderId = existingId;
let error;
if (existingId) {
  ({ error } = await db.from("service_calls").update(payload).eq("id", existingId));
} else {
  const result = await db.from("service_calls").insert(payload).select("id").single();
  error = result.error;
  workOrderId = result.data?.id;
}
if (error || !workOrderId) {
  console.error(error);
  showMessage(error?.message || "Could not save work order.", true);
  return;
}

// For edits, clear an old lead before removing that technician from the team.
// The replacement lead is set after assignment synchronization below.
if (existingId) {
  const {data:oldCall,error:oldCallError} = await db.from("service_calls")
    .select("lead_technician_id").eq("id",workOrderId).single();
  if (oldCallError) { showMessage(oldCallError.message,true); return; }
  if (oldCall.lead_technician_id && oldCall.lead_technician_id !== leadTechnicianId) {
    const {error:clearLeadError} = await db.from("service_calls")
      .update({lead_technician_id:null}).eq("id",workOrderId);
    if (clearLeadError) { showMessage(clearLeadError.message,true); return; }
  }
}

// Add new assignments first; remove deselected assignments only after additions succeed.
const { data: previous, error: readError } = await db.from("service_call_technicians")
  .select("technician_id").eq("service_call_id", workOrderId);
if (readError) {
  showMessage("Work order saved, but assignments could not be read: " + readError.message, true);
  return;
}
const oldIds = (previous || []).map(a => a.technician_id);
const additions = technicianIds.filter(id => !oldIds.includes(id));
const removals = oldIds.filter(id => !technicianIds.includes(id));
if (additions.length) {
  const { error: addError } = await db.from("service_call_technicians")
    .insert(additions.map(technician_id => ({ service_call_id: workOrderId, technician_id })));
  if (addError) {
    showMessage("Work order saved, but technician assignments need attention: " + addError.message, true);
    return;
  }
}
if (removals.length) {
  const { error: removeError } = await db.from("service_call_technicians")
    .delete().eq("service_call_id", workOrderId).in("technician_id", removals);
  if (removeError) {
    showMessage("Work order saved, but old assignments could not be removed: " + removeError.message, true);
    return;
  }
}

// Set the lead only after the lead exists in the assignment table.
const {error:leadError} = await db.from("service_calls")
  .update({lead_technician_id:leadTechnicianId}).eq("id",workOrderId);
if (leadError) {
  showMessage("Assignments saved, but lead technician could not be set: " + leadError.message,true);
  return;
}

showMessage(
  existingId
    ? "Work order saved."
    : "Work order created."
);


await showWorkOrders();


}

    if (!["dispatcher", "secretary"].includes(currentProfile?.role)) {
      showMessage("You do not have permission to delete customers.", true);
      return;
    }
    const button = document.getElementById("deleteCustomer");
    button.disabled = true;
    try {
      // Do not delete a customer that has existing Work Orders or locations.
      const checks = await Promise.all([
        db.from("service_calls").select("id", { count: "exact", head: true }).eq("customer_id", customer.id),
        db.from("locations").select("id", { count: "exact", head: true }).eq("customer_id", customer.id)
      ]);
      for (const result of checks) if (result.error) throw result.error;
      const orders = checks[0].count || 0;
      const locations = checks[1].count || 0;
      if (orders || locations) {
        showMessage(`Cannot delete this customer: ${orders} Work Order(s) and ${locations} location(s) are linked. Reassign them first.`, true);
        return;
      }
      const label = customerSelectionName(customer);
      if (!confirmDelete(`Permanently delete customer "${label}"? This cannot be undone.`)) return;

        .delete().eq("id", customer.id).select("id");

function renderPartsCatalogRows() {
  const body=partField("partsCatalogBody"); if(!body)return;
  const terms=(dispatchSearch.parts||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const rows=partsCatalogCache.filter(p=>(partsCatalogFilter==='all'||(partsCatalogFilter==='active'?p.active:!p.active)) &&
    terms.every(t=>[p.name,p.part_number,p.description,p.manufacturer,p.supplier].some(v=>String(v||'').toLowerCase().includes(t))));
  body.innerHTML=rows.length?rows.map(p=>`<tr>

async function showCatalogPartForm(id=null) {
  if(!partsCanEdit())return showMessage('Read-only access.',true);
  let p=null;
  if(id){const {data,error}=await db.from('parts_catalog').select('*').eq('id',id).single();if(error)return showMessage(error.message,true);p=data;}
  setActiveNav('parts');
  const val=(key)=>escapeAttribute(p?.[key]??'');
  const field=(key,label,type='text',extra='')=>`<div class="form-group"><label for="catalog_${key}">${label}</label><input id="catalog_${key}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} value="${val(key)}" ${extra}></div>`;
  document.getElementById('mainContent').innerHTML=`<div class="page-head"><div><h1>${p?'Edit Part':'New Part'}</h1><p>Only the part name is required. Search for an existing part before saving.</p></div></div>
    <div class="card"><div class="card-body"><form id="catalogPartForm"><div class="form-grid">
      ${field('name','Part Name','text','required autocomplete="off"')}
      ${field('part_number','Part Number')}
      <div class="form-group full"><div class="small-muted">Existing matches (select one to avoid a duplicate):</div><div id="catalogMatches" class="office-intake suggestions" style="border:1px solid #dfe2e6;border-radius:5px;max-height:180px;overflow-y:auto"></div></div>
      ${field('description','Description')}${field('unit_cost','Unit Cost','number')}${field('unit_price','Selling Price','number')}
      ${field('unit_of_measure','Unit of Measure')}${field('reorder_point','Reorder Point','number')}${field('reorder_quantity','Reorder Quantity','number')}
      ${field('manufacturer','Manufacturer')}${field('supplier','Supplier')}${field('location_code','Storage Location')}
      <div class="form-group full"><label for="catalog_notes">Notes</label><textarea id="catalog_notes">${escapeHtml(p?.notes||'')}</textarea></div>
      </div><div class="form-actions"><button type="button" class="secondary" id="cancelCatalogPart">Cancel</button><button type="submit" class="primary" id="saveCatalogPart">${p?'Save Changes':'Create Part'}</button></div></form></div></div>`;
  partField('cancelCatalogPart').onclick=()=>p?showCatalogPartDetail(id):showParts();
  let request=0;
  async function suggest(){
    const q=partEmpty(partField('catalog_name').value||partField('catalog_part_number').value);
    const target=partField('catalogMatches');if(q.length<2){target.innerHTML='';return;}
    const n=++request;
    const {data,error}=await db.rpc('search_parts_catalog',{search_text:q,result_limit:10});
    if(n!==request||!target.isConnected)return;
    if(error){target.textContent=error.message;return;}
    target.innerHTML=(data||[]).filter(x=>x.id!==id).map(x=>`<button type="button" class="suggestion" data-existing-part="${x.id}" style="display:block;width:100%;padding:10px;text-align:left;border:0;border-bottom:1px solid #ddd;background:white">${escapeHtml(x.name)} · ${escapeHtml(x.part_number||'No part number')}</button>`).join('');
    target.querySelectorAll('[data-existing-part]').forEach(b=>b.onclick=()=>showCatalogPartDetail(b.dataset.existingPart));
  }
  partField('catalog_name').addEventListener('input',suggest);
  partField('catalog_part_number').addEventListener('input',suggest);
  partField('catalogPartForm').onsubmit=async e=>{
    e.preventDefault();const btn=partField('saveCatalogPart');if(btn.disabled)return;
    const name=partEmpty(partField('catalog_name').value);
    if(!name)return showMessage('Enter a part name.',true);
    const payload={name};
    ['part_number','description','unit_of_measure','manufacturer','supplier','location_code','notes'].forEach(k=>payload[k]=partEmpty(partField('catalog_'+k).value)||null);
    payload.unit_of_measure ||= 'each';
    ['unit_cost','unit_price','reorder_point'].forEach(k=>payload[k]=Number(partField('catalog_'+k).value||0));
    payload.reorder_quantity=partEmpty(partField('catalog_reorder_quantity').value)===''?null:Number(partField('catalog_reorder_quantity').value);
    btn.disabled=true;
    const query=id?db.from('parts_catalog').update(payload).eq('id',id):db.from('parts_catalog').insert(payload);
    const {data,error}=await query.select('id').single();
    btn.disabled=false;
    if(error)return showMessage(error.message,true);
    showMessage(id?'Part updated.':'Part created.');await showCatalogPartDetail(data.id);
  };
  partField('catalog_name').focus();
}

async function deleteCatalogPart(id){
  if(!partsCanEdit())return showMessage('Read-only access.',true);
  const {count,error:countError}=await db.from('parts').select('id',{count:'exact',head:true}).eq('catalog_part_id',id);
  if(countError)return showMessage(countError.message,true);
  if(count){return showMessage('This part is attached to work orders. Deactivate it to preserve history.',true);}
  const {count:movementCount,error:movementError}=await db.from('parts_inventory_movements').select('id',{count:'exact',head:true}).eq('catalog_part_id',id);
  if(movementError)return showMessage(movementError.message,true);
  if(movementCount)return showMessage('This part has inventory history. Deactivate it instead.',true);
  if(!confirmDelete('Permanently delete this unused catalog part? This cannot be undone.'))return;
  const {error}=await db.from('parts_catalog').delete().eq('id',id);
  if(error)return showMessage(error.message,true);
  showMessage('Part deleted.');await showParts();
}

async function showPartForm(id=null,contextWorkOrderId=null){

  let usage=null;
  if(id){const {data,error}=await db.from('parts').select('*').eq('id',id).single();if(error)return showMessage(error.message,true);usage=data;}
  const workOrderId=contextWorkOrderId||usage?.service_call_id||null;
  document.getElementById('mainContent').innerHTML=`<div class="page-head"><div><h1>${usage?'Edit Work Order Part':'Add Part to Work Order'}</h1><p>Choose an existing catalog part, or create a new catalog entry first.</p></div></div>
  <div class="card"><div class="card-body"><form id="usagePartForm"><div class="form-grid">
    <div class="form-group full"><label>Work Order</label><select id="usageWorkOrder" required><option value="">Loading...</option></select></div>
    <div class="form-group full"><label>Find a Part</label><input id="usagePartSearch" type="search" autocomplete="off" placeholder="Search part name or number..."><div id="usagePartMatches" style="border:1px solid #ddd;border-radius:5px;max-height:200px;overflow-y:auto"></div><div id="usageChosen" class="small-muted"></div></div>
    <div class="form-group"><label>Quantity</label><input id="usageQuantity" type="number" min="1" step="1" required value="${escapeAttribute(usage?.quantity??1)}"></div>
    <div class="form-group"><label>Unit Selling Price</label><input id="usagePrice" type="number" min="0" step="0.01" value="${escapeAttribute(usage?.unit_price??'')}"></div>
    <div class="form-group full"><label>Usage Notes</label><textarea id="usageNotes">${escapeHtml(usage?.notes||'')}</textarea></div>
    </div><div class="form-actions"><button type="button" class="secondary" id="usageCancel">Cancel</button><button type="button" class="secondary" id="usageNewCatalog">+ Create Catalog Part</button><button type="submit" class="primary" id="usageSave">${usage?'Save':'Add to Work Order'}</button></div></form></div></div>`;
  await loadWorkOrderOptions('usageWorkOrder',workOrderId);
  if(contextWorkOrderId)partField('usageWorkOrder').disabled=true;
  let selected=null;
  const {data:initial,error:catalogError}=await db.from('parts_catalog').select('id,name,part_number,description,unit_cost,unit_price,active').eq('active',true).order('name');
  if(catalogError)return showMessage(catalogError.message,true);
  const catalog=initial||[];
  function choose(p){selected=p;partField('usagePartSearch').value=p.name;partField('usageChosen').textContent=`Selected: ${p.name} · ${p.part_number||'No number'}`;partField('usagePartMatches').innerHTML='';if(!usage)partField('usagePrice').value=p.unit_price??0;}
  if(usage?.catalog_part_id){const p=catalog.find(x=>x.id===usage.catalog_part_id);if(p)choose(p);}
  function matches(){const q=partEmpty(partField('usagePartSearch').value).toLowerCase();if(selected&&q!==selected.name.toLowerCase())selected=null;
    const found=q?catalog.filter(p=>[p.name,p.part_number,p.description].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,12):[];
    partField('usagePartMatches').innerHTML=found.map(p=>`<button type="button" class="suggestion" style="display:block;width:100%;padding:10px;text-align:left;border:0;border-bottom:1px solid #ddd;background:white" data-usage-pick="${p.id}">${escapeHtml(p.name)} · ${escapeHtml(p.part_number||'No number')}</button>`).join('');
    partField('usagePartMatches').querySelectorAll('[data-usage-pick]').forEach(b=>b.onclick=()=>choose(catalog.find(p=>p.id===b.dataset.usagePick)));
  }
  partField('usagePartSearch').addEventListener('input',matches);
  partField('usageCancel').onclick=()=>workOrderId?showWorkOrderDetail(workOrderId):showParts();
  partField('usageNewCatalog').onclick=()=>{showMessage('Create the catalog part first, then return to the work order.');showCatalogPartForm();};
  partField('usagePartForm').onsubmit=async e=>{
    e.preventDefault();if(!selected)return showMessage('Select a catalog part from the suggestions.',true);
    const wo=contextWorkOrderId||partField('usageWorkOrder').value;if(!wo)return showMessage('Select a work order.',true);
    const quantity=Number(partField('usageQuantity').value);if(!Number.isInteger(quantity)||quantity<1)return showMessage('Quantity must be a positive whole number.',true);
    const payload={service_call_id:wo,catalog_part_id:selected.id,part_number:selected.part_number||null,description:selected.name,quantity,unit_cost:Number(selected.unit_cost||0),unit_price:Number(partField('usagePrice').value||0),notes:partEmpty(partField('usageNotes').value)||null};
    const btn=partField('usageSave');btn.disabled=true;
    const {error}=usage?await db.from('parts').update(payload).eq('id',usage.id):await db.from('parts').insert(payload);
    btn.disabled=false;if(error)return showMessage(error.message,true);
    showMessage(usage?'Work-order part updated.':'Part added to work order.');await showWorkOrderDetail(wo);
  };
  partField('usagePartSearch').focus();
}

  if (readError) { showMessage(readError.message, true); return; }
  // Delete the database record first. If forbidden, do not touch Storage.
  const { data: deleted, error } = await db.from("service_call_photos")
    .delete().eq("id", id).select("id");
  if (error || !deleted?.length) {
    showMessage(error?.message || "You do not have permission to delete this photo.", true);
    return;
  }
  if (photo.file_path && !/^https?:\/\//i.test(photo.file_path)) {
    const result = await db.storage.from("dispatch-photos").remove([photo.file_path]);
    if (result.error) {
      console.error("Storage deletion:", result.error);
      showMessage("Photo record removed, but storage cleanup failed: " + result.error.message, true);
      await showPhotos();
      return;
    }
  }
  showMessage("Photo deleted.");
  await showPhotos();
}

async function updateScheduleBlockState(id, action){
 try {
  const {data:b,error:readError}=await db.from('schedule_blocks').select('id,title,status,released').eq('id',id).single();
  if(readError)throw readError;
  let changes;
  if(action==='release'){
   if(b.status!=='approved')return showMessage('Only approved blocks can be released.',true);
   changes={released:true};
  }else if(action==='unrelease'){
   changes={released:false};
  }else if(action==='cancel'){
   if(!confirm(`Cancel "${b.title}"? It will remain in the history.`))return;
   changes={status:'cancelled',released:false};
  }else if(action==='delete'){
   if(!confirm(`PERMANENTLY DELETE "${b.title}" and its related assignments and requests? This cannot be undone.`))return;
   const {error}=await db.from('schedule_blocks').delete().eq('id',id);
   if(error)throw error;
   showMessage('Schedule block permanently deleted.');
   return await showScheduleBlocks();
  }else return;
  const {error}=await db.from('schedule_blocks').update({...changes,updated_at:new Date().toISOString()}).eq('id',id);
  if(error)throw error;
  showMessage(action==='release'?'Released to assigned technicians.':action==='unrelease'?'Block unreleased.':'Block cancelled.');
  await showScheduleBlockDetail(id);
 }catch(e){console.error(e);showMessage(e.message,true)}
}
