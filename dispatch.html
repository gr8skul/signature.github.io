<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signature Dispatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f4f5f7;
      --surface: #ffffff;
      --border: #dfe2e6;
      --text: #202326;
      --muted: #6b7075;
      --accent: #222;
      --danger: #a52a2a;
      --success: #356b45;
      --warning: #8a641f;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      height: 68px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-section {
      color: var(--muted);
      font-size: 14px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
    }

    .user-role {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .sign-out {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      color: var(--text);
    }

    .sign-out:hover {
      background: #f0f1f2;
    }

    .app {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    nav {
      width: 220px;
      background: #fafafa;
      border-right: 1px solid var(--border);
      padding: 22px 14px;
      flex-shrink: 0;
    }

    .nav-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 4px 10px 10px;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 11px 10px;
      margin-bottom: 3px;
      color: var(--text);
    }

    .nav-button:hover,
    .nav-button.active {
      background: #e9eaec;
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1500px;
      width: 100%;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .primary {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font-weight: 600;
    }

    .primary:hover {
      background: #000;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .card-body {
      padding: 18px;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-controls button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 11px;
    }

    .date-controls strong {
      min-width: 190px;
      text-align: center;
      font-size: 15px;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 18px;
      padding: 17px 18px;
      border-bottom: 1px solid #eceef0;
      align-items: center;
    }

    .schedule-item:last-child {
      border-bottom: 0;
    }

    .schedule-time {
      font-size: 14px;
      font-weight: 600;
    }

    .schedule-description {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .schedule-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status,
    .type-badge,
    .release-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status {
      background: #eceef0;
      text-transform: capitalize;
    }

    .type-badge {
      background: #f0f1f2;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-right: 5px;
    }

    .release-badge {
      background: #f0f1f2;
    }

    .release-badge.released {
      background: #e5efe7;
      color: var(--success);
    }

    .release-badge.unreleased {
      background: #f3eee3;
      color: var(--warning);
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #eceef0;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .row-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .row-button:hover {
      background: #f0f1f2;
    }

    .filter-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .filter-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .filter-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd3d7;
      border-radius: 5px;
      padding: 10px 11px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 28px;
    }

    .checkbox-row input {
      width: auto;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

    .secondary {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 15px;
    }

    .secondary:hover {
      background: #f0f1f2;
    }

    .danger {
      background: white;
      color: var(--danger);
      border: 1px solid #d9b5b5;
      border-radius: 5px;
      padding: 10px 15px;
    }

    .danger:hover {
      background: #faf0f0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .detail-item {
      border-bottom: 1px solid #eceef0;
      padding-bottom: 12px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
    }

    #message {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #222;
      color: white;
      padding: 13px 17px;
      border-radius: 6px;
      display: none;
      z-index: 50;
      font-size: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
      max-width: 420px;
    }

    #message.error {
      background: var(--danger);
    }

    @media (max-width: 800px) {
      header {
        padding: 0 16px;
      }

      .brand-section,
      .user-role {
        display: none;
      }

      nav {
        width: 175px;
      }

      main {
        padding: 20px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .schedule-item {
        grid-template-columns: 70px 1fr;
      }

      .schedule-item .schedule-actions {
        grid-column: 2;
      }

      .form-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .app {
        display: block;
      }

      nav {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }

      .nav-label {
        display: none;
      }

      .nav-button {
        width: auto;
        white-space: nowrap;
        margin: 0;
      }

      main {
        padding: 16px;
      }

      .schedule-item {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .schedule-item .schedule-actions {
        grid-column: auto;
      }

      .date-controls strong {
        min-width: 0;
      }
    }
  </style>

</head>

<script>

  const SUPABASE_URL =
    "https://zpawrfdfutswbvhlwvqf.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_NGa3aWmkMCXm45Hf4m-RYQ_QitmMq68";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let currentUser = null;
  let currentProfile = null;
  let currentDate = new Date();
  let currentWorkOrderFilter = "all";


  // ============================================
  // HELPERS
  // ============================================

  function showMessage(text, error = false) {
    const element = document.getElementById("message");

    element.textContent = text;
    element.className = error ? "error" : "";
    element.style.display = "block";

    setTimeout(() => {
      element.style.display = "none";
    }, 4000);
  }


  function formatDate(date) {
    return date.toLocaleDateString(
      "en-US",
      {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );
  }


  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function customerName(customer) {
    if (!customer) {
      return "Customer";
    }

    if (customer.company_name) {
      return customer.company_name;
    }

    return `${customer.first_name || ""} ${customer.last_name || ""}`
      .trim() || "Unnamed Customer";
  }


  function technicianName(technician) {
    if (!technician) {
      return "Unassigned";
    }

    return `${technician.first_name || ""} ${technician.last_name || ""}`
      .trim() || "Technician";
  }


  function workTypeLabel(type) {
    return type === "install"
      ? "Installation"
      : "Service";
  }


  function statusLabel(status) {
    return String(status || "open")
      .replaceAll("_", " ")
      .replace(/\b\w/g, letter => letter.toUpperCase());
  }


  function localDateTimeValue(date) {
    const d = new Date(date);

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const hours = String(d.getHours()).padStart(2, "0");
    const minutes = String(d.getMinutes()).padStart(2, "0");

    return `${year}-${month}-${day}T${hours}:${minutes}`;
  }


  function escapeAttribute(value) {
    return escapeHtml(value);
  }


  // ============================================
  // AUTH
  // ============================================

  async function requireLogin() {

    const {
      data: {
        session
      }
    } = await db.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return false;
    }

    currentUser = session.user;

    return true;
  }


  async function loadUserProfile() {

    const {
      data,
      error
    } = await db
      .from("users")
      .select("*")
      .eq("auth_user_id", currentUser.id)
      .single();

    if (error) {
      console.error(error);

      showMessage(
        "Unable to load your Signature profile.",
        true
      );

      return false;
    }

    currentProfile = data;

    document.getElementById("userName")
      .textContent =
      `${data.first_name || ""} ${data.last_name || ""}`.trim();

    document.getElementById("userRole")
      .textContent =
      data.role || "";

    return true;
  }


  // ============================================
  // SCHEDULE
  // ============================================

  async function showSchedule() {

    setActiveNav("schedule");

    const main =
      document.getElementById("mainContent");

    main.innerHTML = `

      <div class="page-head">

        <div>
          <h1>Schedule</h1>
          <p>Dispatch schedule for the selected day.</p>
        </div>

        <button
          class="primary"
          id="newWorkOrderButton"
        >
          + New Work Order
        </button>

      </div>

      <div class="card">

        <div class="card-head">

          <div class="date-controls">

            <button id="previousDay">‹</button>

            <strong id="scheduleDate">
              ${formatDate(currentDate)}
            </strong>

            <button id="nextDay">›</button>

            <button id="todayButton">
              Today
            </button>

          </div>

        </div>

        <div
          class="schedule-list"
          id="scheduleList"
        >
          <div class="empty">
            Loading schedule...
          </div>
        </div>

      </div>
    `;

    document.getElementById("previousDay")
      .addEventListener("click", () => {

        currentDate.setDate(
          currentDate.getDate() - 1
        );

        showSchedule();
      });


    document.getElementById("nextDay")
      .addEventListener("click", () => {

        currentDate.setDate(
          currentDate.getDate() + 1
        );

        showSchedule();
      });


    document.getElementById("todayButton")
      .addEventListener("click", () => {

        currentDate = new Date();

        showSchedule();
      });


    document.getElementById("newWorkOrderButton")
      .addEventListener(
        "click",
        () => showWorkOrderForm()
      );


    await loadSchedule();
  }


  async function loadSchedule() {

    const list =
      document.getElementById("scheduleList");

    const start = new Date(currentDate);
    start.setHours(0, 0, 0, 0);

    const end = new Date(currentDate);
    end.setHours(23, 59, 59, 999);

    const {
      data,
      error
    } = await db
      .from("service_calls")
      .select(`
        *,
        customers (
          first_name,
          last_name,
          company_name
        ),
        locations (
          address,
          city,
          state
        ),
        technicians (
          first_name,
          last_name
        )
      `)
      .gte(
        "scheduled_at",
        start.toISOString()
      )
      .lte(
        "scheduled_at",
        end.toISOString()
      )
      .order(
        "scheduled_at",
        {
          ascending: true
        }
      );

    if (error) {
      console.error(error);

      list.innerHTML = `
        <div class="empty">
          Unable to load the schedule.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      list.innerHTML = `
        <div class="empty">
          No work is scheduled for this day.
        </div>
      `;

      return;
    }

    list.innerHTML =
      data.map(call => {

        const scheduled =
          new Date(call.scheduled_at);

        const customer =
          customerName(call.customers);

        const technician =
          technicianName(call.technicians);

        const location =
          call.locations
            ? `${call.locations.address || ""}, ${call.locations.city || ""}, ${call.locations.state || ""}`
            : "No location";

        const releasedClass =
          call.released
            ? "released"
            : "unreleased";

        const releasedText =
          call.released
            ? "Released"
            : "Not Released";

        return `

          <div class="schedule-item">

            <div class="schedule-time">
              ${scheduled.toLocaleTimeString(
                "en-US",
                {
                  hour: "numeric",
                  minute: "2-digit"
                }
              )}
            </div>

            <div>

              <div class="schedule-description">
                ${escapeHtml(
                  call.description ||
                  customer
                )}
              </div>

              <div class="schedule-meta">

                <span class="type-badge">
                  ${escapeHtml(
                    workTypeLabel(call.work_type)
                  )}
                </span>

                ${escapeHtml(customer)}

                &nbsp; · &nbsp;

                ${escapeHtml(technician)}

                &nbsp; · &nbsp;

                ${escapeHtml(location)}

                <br>

                ${escapeHtml(
                  call.priority || "normal"
                )}

              </div>

            </div>

            <div class="schedule-actions">

              <span class="release-badge ${releasedClass}">
                ${releasedText}
              </span>

              <br><br>

              <button
                class="row-button"
                onclick="showWorkOrderDetail('${call.id}')"
              >
                Open
              </button>

            </div>

          </div>
        `;

      }).join("");
  }


  // ============================================
  // WORK ORDERS
  // ============================================

  async function showWorkOrders(filter = currentWorkOrderFilter) {

    currentWorkOrderFilter = filter;

    setActiveNav("work-orders");

    const main =
      document.getElementById("mainContent");

    main.innerHTML = `

      <div class="page-head">

        <div>
          <h1>Work Orders</h1>
          <p>
            All dispatch work, including work not yet released to technicians.
          </p>
        </div>

        <button
          class="primary"
          id="newWorkOrderButton"
        >
          + New Work Order
        </button>

      </div>

      <div class="card">

        <div class="filter-bar">

          ${filterButton("all", "All")}
          ${filterButton("service", "Service")}
          ${filterButton("install", "Installation")}
          ${filterButton("upcoming", "Upcoming")}
          ${filterButton("in_progress", "Current / In Progress")}
          ${filterButton("completed", "Completed")}
          ${filterButton("cancelled", "Cancelled")}

        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Type</th>
                <th>Customer</th>
                <th>Location</th>
                <th>Scheduled</th>
                <th>Technician</th>
                <th>Status</th>
                <th>Release</th>
                <th></th>
              </tr>
            </thead>

            <tbody id="workOrdersBody">

              <tr>
                <td colspan="8">
                  <div class="empty">
                    Loading work orders...
                  </div>
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>
    `;


    document.getElementById("newWorkOrderButton")
      .addEventListener(
        "click",
        () => showWorkOrderForm()
      );


    document.querySelectorAll(".filter-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            showWorkOrders(
              button.dataset.filter
            );

          }
        );

      });


    await loadWorkOrders();
  }


  function filterButton(value, label) {

    return `
      <button
        class="filter-button ${currentWorkOrderFilter === value ? "active" : ""}"
        data-filter="${value}"
      >
        ${label}
      </button>
    `;
  }


  async function loadWorkOrders() {

    const body =
      document.getElementById("workOrdersBody");

    let query =
      db
        .from("service_calls")
        .select(`
          *,
          customers (
            first_name,
            last_name,
            company_name
          ),
          locations (
            address,
            city,
            state
          ),
          technicians (
            first_name,
            last_name
          )
        `)
        .order(
          "scheduled_at",
          {
            ascending: true,
            nullsFirst: false
          }
        );


    if (
      currentWorkOrderFilter === "service" ||
      currentWorkOrderFilter === "install"
    ) {

      query =
        query.eq(
          "work_type",
          currentWorkOrderFilter
        );

    }


    if (
      currentWorkOrderFilter === "in_progress"
    ) {

      query =
        query.eq(
          "status",
          "in_progress"
        );

    }


    if (
      currentWorkOrderFilter === "completed"
    ) {

      query =
        query.eq(
          "status",
          "completed"
        );

    }


    if (
      currentWorkOrderFilter === "cancelled"
    ) {

      query =
        query.eq(
          "status",
          "cancelled"
        );

    }


    if (
      currentWorkOrderFilter === "upcoming"
    ) {

      query =
        query
          .gte(
            "scheduled_at",
            new Date().toISOString()
          )
          .neq(
            "status",
            "completed"
          )
          .neq(
            "status",
            "cancelled"
          );

    }


    const {
      data,
      error
    } = await query;


    if (error) {

      console.error(error);

      body.innerHTML = `
        <tr>
          <td colspan="8">

            <div class="empty">
              Unable to load work orders.<br><br>
              ${escapeHtml(error.message)}
            </div>

          </td>
        </tr>
      `;

      return;
    }


    if (!data || data.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="8">

            <div class="empty">
              No work orders match this view.
            </div>

          </td>
        </tr>
      `;

      return;
    }


    body.innerHTML =
      data.map(call => {

        const scheduled =
          call.scheduled_at
            ? new Date(call.scheduled_at)
                .toLocaleString(
                  "en-US",
                  {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                  }
                )
            : "Not scheduled";


        const location =
          call.locations
            ? `${call.locations.city || ""}, ${call.locations.state || ""}`
            : "—";


        return `

          <tr>

            <td>
              <span class="type-badge">
                ${escapeHtml(
                  workTypeLabel(call.work_type)
                )}
              </span>
            </td>

            <td>
              ${escapeHtml(
                customerName(call.customers)
              )}
            </td>

            <td>
              ${escapeHtml(location)}
            </td>

            <td>
              ${escapeHtml(scheduled)}
            </td>

            <td>
              ${escapeHtml(
                technicianName(call.technicians)
              )}
            </td>

            <td>
              <span class="status">
                ${escapeHtml(
                  statusLabel(call.status)
                )}
              </span>
            </td>

            <td>

              <span
                class="release-badge ${call.released ? "released" : "unreleased"}"
              >
                ${call.released ? "Released" : "Not Released"}

async function saveWorkOrder(
event,
existingId
) {


event.preventDefault();


const customerId =
  document.getElementById("customer").value;

const locationId =
  document.getElementById("location").value;

const technicianId =
  document.getElementById("technician").value ||
  null;

const workType =
  document.getElementById("workType").value;

const scheduledAt =
  document.getElementById("scheduledAt").value;

const priority =
  document.getElementById("priority").value;

const status =
  document.getElementById("status").value;

const released =
  document.getElementById("released").checked;

const description =
  document.getElementById("description")
    .value
    .trim();


if (!customerId || !locationId) {

  showMessage(
    "Customer and location are required.",
    true
  );

  return;
}


const payload = {

  customer_id:
    customerId,

  locations_id:
    locationId,

  assigned_technician_id:
    technicianId,

  work_type:
    workType,

  released:
    released,

  status:
    status,

  priority:
    priority,

  description:
    description,

  scheduled_at:
    scheduledAt
      ? new Date(scheduledAt).toISOString()
      : null
};


let error;


if (existingId) {

  ({
    error
  } =
    await db
      .from("service_calls")
      .update(payload)
      .eq(
        "id",
        existingId
      ));

} else {

  ({
    error
  } =
    await db
      .from("service_calls")
      .insert(payload));

}


if (error) {

  console.error(error);

  showMessage(
    error.message,
    true
  );

  return;
}


showMessage(
  existingId
    ? "Work order saved."
    : "Work order created."
);


await showWorkOrders();


}
