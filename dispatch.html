<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signature Dispatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f4f5f7;
      --surface: #ffffff;
      --border: #dfe2e6;
      --text: #202326;
      --muted: #6b7075;
      --accent: #222;
      --danger: #a52a2a;
      --success: #356b45;
      --warning: #8a641f;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      height: 68px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-section {
      color: var(--muted);
      font-size: 14px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
    }

    .user-role {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .sign-out {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      color: var(--text);
    }

    .sign-out:hover {
      background: #f0f1f2;
    }

    .app {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    nav {
      width: 220px;
      background: #fafafa;
      border-right: 1px solid var(--border);
      padding: 22px 14px;
      flex-shrink: 0;
    }

    .nav-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 4px 10px 10px;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 11px 10px;
      margin-bottom: 3px;
      color: var(--text);
    }

    .nav-button:hover,
    .nav-button.active {
      background: #e9eaec;
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1500px;
      width: 100%;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .primary {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font-weight: 600;
    }

    .primary:hover {
      background: #000;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .card-body {
      padding: 18px;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-controls button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 11px;
    }

    .date-controls strong {
      min-width: 190px;
      text-align: center;
      font-size: 15px;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 18px;
      padding: 17px 18px;
      border-bottom: 1px solid #eceef0;
      align-items: center;
    }

    .schedule-item:last-child {
      border-bottom: 0;
    }

    .schedule-time {
      font-size: 14px;
      font-weight: 600;
    }

    .schedule-description {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .schedule-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status,
    .type-badge,
    .release-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status {
      background: #eceef0;
      text-transform: capitalize;
    }

    .type-badge {
      background: #f0f1f2;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-right: 5px;
    }

    .release-badge {
      background: #f0f1f2;
    }

    .release-badge.released {
      background: #e5efe7;
      color: var(--success);
    }

    .release-badge.unreleased {
      background: #f3eee3;
      color: var(--warning);
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #eceef0;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .row-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .row-button:hover {
      background: #f0f1f2;
    }

    .filter-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .filter-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .filter-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .dispatch-search {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .dispatch-search label { display:block; margin-bottom:7px; }
    .dispatch-search input { max-width: 680px; }
    .dispatch-search .small-muted { margin-top: 7px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd3d7;
      border-radius: 5px;
      padding: 10px 11px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 28px;
    }

    .checkbox-row input {
      width: auto;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

    .secondary {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 15px;
    }

    .secondary:hover {
      background: #f0f1f2;
    }

    .danger {
      background: white;
      color: var(--danger);
      border: 1px solid #d9b5b5;
      border-radius: 5px;
      padding: 10px 15px;
    }

    .danger:hover {
      background: #faf0f0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .detail-item {
      border-bottom: 1px solid #eceef0;
      padding-bottom: 12px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
    }

    .small-muted {
      color: var(--muted);
      font-size: 12px;
    }

    .photo-preview {
      max-width: 180px;
      max-height: 120px;
      border-radius: 5px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    #message {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #222;
      color: white;
      padding: 13px 17px;
      border-radius: 6px;
      display: none;
      z-index: 50;
      font-size: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
      max-width: 420px;
    }

    #message.error {
      background: var(--danger);
    }

    @media (max-width: 800px) {
      header {
        padding: 0 16px;
      }

      .brand-section,
      .user-role {
        display: none;
      }

      nav {
        width: 175px;
      }

      main {
        padding: 20px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .schedule-item {
        grid-template-columns: 70px 1fr;
      }

      .schedule-item .schedule-actions {
        grid-column: 2;
      }

      .form-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .app {
        display: block;
      }

      nav {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }

      .nav-label {
        display: none;
      }

      .nav-button {
        width: auto;
        white-space: nowrap;
        margin: 0;
      }

      main {
        padding: 16px;
      }

      .schedule-item {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .schedule-item .schedule-actions {
        grid-column: auto;
      }

      .date-controls strong {
        min-width: 0;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="brand">
    <div class="brand-name">SIGNATURE</div>
    <div class="brand-section">DISPATCH</div>
  </div>

  <div class="user-area">
    <div class="user-info">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-role" id="userRole">Loading...</div>
    </div>


<button class="sign-out" id="signOutButton">
  Sign Out
</button>


  </div>
</header>

<div class="app">

  <nav>
    <div class="nav-label">Dispatch</div>


<button class="nav-button active" data-page="schedule">
  Schedule
</button>

<button class="nav-button" data-page="work-orders">
  Work Orders
</button>

<button class="nav-button" data-page="customers">
  Customers
</button>

<button class="nav-button" data-page="locations">
  Locations
</button>

<button class="nav-button" data-page="technicians">
  Technicians
</button>

<button class="nav-button" data-page="parts">
  Parts
</button>

<button class="nav-button" data-page="notes">
  Notes
</button>

<button class="nav-button" data-page="photos">
  Photos
</button>


  </nav>

  <main id="mainContent">
    <div class="empty">
      Loading Dispatch...
    </div>
  </main>

</div>

<div id="message"></div>

<script>

  const SUPABASE_URL =
    "https://zpawrfdfutswbvhlwvqf.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_NGa3aWmkMCXm45Hf4m-RYQ_QitmMq68";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let currentUser = null;
  let currentProfile = null;
  let currentDate = new Date();
  let currentWorkOrderFilter = "all";
  const dispatchSearch = { "work-orders": "", parts: "", notes: "", photos: "",
    customers: "", locations: "", technicians: "" };


  // ============================================
  // HELPERS
  // ============================================

  function showMessage(text, error = false) {

    const element =
      document.getElementById("message");

    element.textContent = text;
    element.className = error ? "error" : "";
    element.style.display = "block";

    setTimeout(() => {
      element.style.display = "none";
    }, 4000);
  }


  function formatDate(date) {

    return date.toLocaleDateString(
      "en-US",
      {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function customerName(customer) {

    if (!customer) {
      return "Customer";
    }

    if (customer.company_name) {
      return customer.company_name;
    }

    return (
      `${customer.first_name || ""} ${customer.last_name || ""}`
        .trim()
      || "Unnamed Customer"
    );
  }


  // Show the business and its contact person together when both exist.
  function customerDisplayHtml(customer) {
    const business = String(customer?.company_name || "").trim();
    const contact = [customer?.first_name, customer?.last_name]
      .filter(Boolean).join(" ").trim();
    const primary = business || contact || "Unnamed Customer";
    return `<strong>${escapeHtml(primary)}</strong>` +
      (business && contact
        ? `<div class="small-muted">Contact: ${escapeHtml(contact)}</div>`
        : "");
  }

  function customerSelectionName(customer) {
    const business = String(customer?.company_name || "").trim();
    const contact = [customer?.first_name, customer?.last_name]
      .filter(Boolean).join(" ").trim();
    return business && contact ? `${business} — ${contact}`
      : business || contact || "Unnamed Customer";
  }

  function technicianName(technician) {

    if (!technician) {
      return "Unassigned";
    }

    return (
      `${technician.first_name || ""} ${technician.last_name || ""}`
        .trim()
      || "Technician"
    );
  }


  function workOrderLabel(call) {
    return call.work_order_number != null
      ? `WO-${String(call.work_order_number).padStart(6, "0")}`
      : `ID ${String(call.id || "").slice(0, 8)}`;
  }

  function dispatchSearchField(page) {
    return `
      <div class="dispatch-search">
        <label for="dispatchSearchInput">Search ${page === "work-orders" ? "Work Orders" : page[0].toUpperCase() + page.slice(1)}</label>
        <input id="dispatchSearchInput" type="search"
          placeholder="${escapeAttribute({
            customers: "Name, company, phone, email…",
            locations: "Address, city, state, ZIP, customer…",
            technicians: "Name, title, phone, email…"
          }[page] || "Work order number, customer, description, keywords…")}"
          value="${escapeAttribute(dispatchSearch[page] || "")}">
        <div id="dispatchSearchCount" class="small-muted" aria-live="polite"></div>
      </div>`;
  }

  function setupDispatchSearch(page, bodyId) {
    const input = document.getElementById("dispatchSearchInput");
    if (!input) return;
    input.addEventListener("input", () => {
      dispatchSearch[page] = input.value;
      applyDispatchSearch(page, bodyId);
    });
  }

  function dispatchSearchText(record, extra = []) {
    const call = record.service_calls || record;
    const customer = call.customers || {};
    const number = call.work_order_number == null ? "" : String(call.work_order_number);
    return [
      number, number ? `WO-${number.padStart(6, "0")}` : "",
      call.work_type, workTypeLabel(call.work_type),
      call.description, customer.first_name, customer.last_name,
      customer.company_name, customerName(customer),
      ...extra
    ].map(x => String(x ?? "")).join(" ").toLowerCase();
  }

  function directorySearchText(record, page) {
    let values = [];
    if (page === "customers") {
      values = [record.first_name, record.last_name,
        `${record.first_name || ""} ${record.last_name || ""}`.trim(),
        record.company_name, record.phone, record.email];
    } else if (page === "locations") {
      const customer = record.customers || {};
      values = [record.address, record.city, record.state, record.zip,
        customer.first_name, customer.last_name,
        `${customer.first_name || ""} ${customer.last_name || ""}`.trim(),
        customer.company_name, customerName(customer)];
    } else if (page === "technicians") {
      values = [record.first_name, record.last_name,
        technicianName(record), record.title, record.phone, record.email,
        record.active ? "active" : "inactive"];
    }
    return values.map(value => String(value ?? "")).join(" ").toLowerCase();
  }

  function applyDispatchSearch(page, bodyId) {
    const body = document.getElementById(bodyId);
    if (!body || !body._dispatchRecords) return;
    const terms = (dispatchSearch[page] || "").trim().toLowerCase().split(/\\s+/).filter(Boolean);
    const matching = body._dispatchRecords.filter(item =>
      terms.every(term => item.search.includes(term))
    );
    body.innerHTML = matching.length
      ? matching.map(item => item.html).join("")
      : `<tr><td colspan="${page === "work-orders" ? 10 : page === "parts" ? 8 : page === "notes" ? 6 : page === "customers" ? 4 : 6}">
          <div class="empty">No matching records.</div></td></tr>`;
    const count = document.getElementById("dispatchSearchCount");
    if (count) count.textContent = `${matching.length} of ${body._dispatchRecords.length} records shown`;
  }

  function relatedWorkOrderCell(call) {
    if (!call) return "Work Order unavailable";
    const customer = customerName(call.customers);
    return `
      <strong>${escapeHtml(workOrderLabel(call))}</strong>
      <div class="small-muted">${customerDisplayHtml(call.customers)}</div>
    `;
  }

  function relatedWorkTypeCell(call) {
    return call
      ? `<span class="type-badge">${escapeHtml(workTypeLabel(call.work_type))}</span>`
      : "—";
  }

  function relatedDescriptionCell(call) {
    return call
      ? `<span title="${escapeAttribute(call.description || "")}">${escapeHtml(descriptionPreview(call.description))}</span>`
      : "—";
  }

  function descriptionPreview(value, limit = 72) {
    const clean = String(value || "No description").replace(/\s+/g, " ").trim();
    return clean.length > limit ? clean.slice(0, limit - 3) + "..." : clean;
  }

  function workTypeLabel(type) {

    return type === "checkout" ? "Check-Out" : type === "install" ? "Installation" : "Service";
  }


  function statusLabel(status) {

    return String(status || "open")
      .replaceAll("_", " ")
      .replace(/\b\w/g, letter => letter.toUpperCase());
  }


  function localDateTimeValue(date) {

    const d = new Date(date);

    const year =
      d.getFullYear();

    const month =
      String(d.getMonth() + 1).padStart(2, "0");

    const day =
      String(d.getDate()).padStart(2, "0");

    const hours =
      String(d.getHours()).padStart(2, "0");

    const minutes =
      String(d.getMinutes()).padStart(2, "0");

    return (
      `${year}-${month}-${day}T${hours}:${minutes}`
    );
  }


  function escapeAttribute(value) {
    return escapeHtml(value);
  }


  function confirmDelete(message) {
    return window.confirm(message);
  }


  // ============================================
  // AUTH
  // ============================================

  async function requireLogin() {

    const {
      data: {
        session
      }
    } = await db.auth.getSession();

    if (!session) {

      window.location.href =
        "login.html";

      return false;
    }

    currentUser =
      session.user;

    return true;
  }


  async function loadUserProfile() {

    const {
      data,
      error
    } = await db
      .from("users")
      .select("*")
      .eq(
        "auth_user_id",
        currentUser.id
      )
      .single();

    if (error) {

      console.error(error);

      showMessage(
        "Unable to load your Signature profile.",
        true
      );

      return false;
    }

    currentProfile =
      data;

    document.getElementById("userName")
      .textContent =
      `${data.first_name || ""} ${data.last_name || ""}`.trim();

    document.getElementById("userRole")
      .textContent =
      data.role || "";

    return true;
  }


  // ============================================
  // SCHEDULE
  // ============================================

  async function showSchedule() {

    setActiveNav("schedule");

    const main =
      document.getElementById("mainContent");

    main.innerHTML = `

      <div class="page-head">

        <div>
          <h1>Schedule</h1>
          <p>Dispatch schedule for the selected day.</p>
        </div>

        <button
          class="primary"
          id="newWorkOrderButton"
        >
          + New Work Order
        </button>

      </div>

      <div class="card">

        <div class="card-head">

          <div class="date-controls">

            <button id="previousDay">‹</button>

            <strong id="scheduleDate">
              ${formatDate(currentDate)}
            </strong>

            <button id="nextDay">›</button>

            <button id="todayButton">
              Today
            </button>

          </div>

        </div>

        <div
          class="schedule-list"
          id="scheduleList"
        >
          <div class="empty">
            Loading schedule...
          </div>
        </div>

      </div>
    `;

    document.getElementById("previousDay")
      .addEventListener("click", () => {

        currentDate.setDate(
          currentDate.getDate() - 1
        );

        showSchedule();
      });


    document.getElementById("nextDay")
      .addEventListener("click", () => {

        currentDate.setDate(
          currentDate.getDate() + 1
        );

        showSchedule();
      });


    document.getElementById("todayButton")
      .addEventListener("click", () => {

        currentDate =
          new Date();

        showSchedule();
      });


    document.getElementById("newWorkOrderButton")
      .addEventListener(

  async function loadSchedule() {

    const list =
      document.getElementById("scheduleList");

    const start =
      new Date(currentDate);

    start.setHours(
      0,
      0,
      0,
      0
    );

    const end =
      new Date(currentDate);

    end.setHours(
      23,
      59,
      59,
      999
    );

    const {
      data,
      error
    } = await db
      .from("service_calls")
      .select(`
        *,
        customers (
          first_name,
          last_name,
          company_name
        ),
        locations (
          address,
          city,
          state
        ),
        technicians (
          first_name,
          last_name
        )
      `)
      .gte(
        "scheduled_at",
        start.toISOString()
      )
      .lte(
        "scheduled_at",
        end.toISOString()
      )
      .order(
        "scheduled_at",
        {
          ascending: true
        }
      );

    if (error) {

      console.error(error);

      list.innerHTML = `
        <div class="empty">
          Unable to load the schedule.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML = `
        <div class="empty">
          No work is scheduled for this day.
        </div>
      `;

      return;
    }

    list.innerHTML =
      data.map(call => {

        const scheduled =
          new Date(call.scheduled_at);

        const customer =
          customerName(call.customers);

        const technician =
          technicianName(call.technicians);

        const location =
          call.locations
            ? `${call.locations.address || ""}, ${call.locations.city || ""}, ${call.locations.state || ""}`
            : "No location";

        const releasedClass =
          call.released
            ? "released"
            : "unreleased";

        const releasedText =
          call.released
            ? "Released"
            : "Not Released";

        return `

          <div class="schedule-item">

            <div class="schedule-time">
              ${scheduled.toLocaleTimeString(
                "en-US",
                {
                  hour: "numeric",
                  minute: "2-digit"
                }
              )}
            </div>

            <div>

              <div class="schedule-description">
                ${escapeHtml(
                  call.description ||
                  customer
                )}
              </div>

              <div class="schedule-meta">

                <span class="type-badge">
                  ${escapeHtml(
                    workTypeLabel(call.work_type)
                  )}
                </span>

                ${escapeHtml(customer)}

                &nbsp; · &nbsp;

                ${escapeHtml(technician)}

                &nbsp; · &nbsp;

                ${escapeHtml(location)}

                <br>

                ${escapeHtml(
                  call.priority || "normal"
                )}

              </div>

            </div>

            <div class="schedule-actions">

              <span class="release-badge ${releasedClass}">
                ${releasedText}
              </span>

              <br><br>

              <button
                class="row-button"
                onclick="showWorkOrderDetail('${call.id}')"
              >
                Open
              </button>

            </div>

          </div>
        `;

      }).join("");
  }

  async function loadWorkOrders() {

    const body =
      document.getElementById("workOrdersBody");

    let query =
      db
        .from("service_calls")
        .select(`
          *,
          customers (
            first_name,
            last_name,
            company_name
          ),
          locations (
            address,
            city,
            state
          ),
          technicians (
            first_name,
            last_name
          )
        `)
        .order(
          "scheduled_at",
          {
            ascending: true,
            nullsFirst: false
          }
        );


    if (
      currentWorkOrderFilter === "service" ||
      currentWorkOrderFilter === "install" ||
      currentWorkOrderFilter === "checkout"
    ) {

      query =
        query.eq(
          "work_type",
          currentWorkOrderFilter
        );
    }


    if (
      currentWorkOrderFilter === "in_progress"
    ) {

      query =
        query.eq(
          "status",
          "in_progress"
        );
    }


    if (
      currentWorkOrderFilter === "completed"
    ) {

      query =
        query.eq(
          "status",
          "completed"
        );
    }


    if (
      currentWorkOrderFilter === "cancelled"
    ) {

      query =
        query.eq(
          "status",
          "cancelled"
        );
    }


    if (
      currentWorkOrderFilter === "upcoming"
    ) {

      query =
        query
          .gte(
            "scheduled_at",
            new Date().toISOString()
          )
          .neq(
            "status",
            "completed"
          )
          .neq(
            "status",
            "cancelled"
          );
    }


    const {
      data,
      error
    } = await query;


    if (error) {

      console.error(error);

      body.innerHTML = `
        <tr>
          <td colspan="10">

            <div class="empty">
              Unable to load work orders.<br><br>
              ${escapeHtml(error.message)}
            </div>

          </td>
        </tr>
      `;

      return;
    }


    if (!data || data.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="10">

            <div class="empty">
              No work orders match this view.
            </div>

          </td>
        </tr>
      `;

      return;
    }


    body._dispatchRecords =
      data.map(call => {

        const scheduled =
          call.scheduled_at
            ? new Date(
                call.scheduled_at
              ).toLocaleString(
                "en-US",
                {
                  month: "short",
                  day: "numeric",
                  year: "numeric",
                  hour: "numeric",
                  minute: "2-digit"
                }
              )
            : "Not scheduled";


        const location =
          call.locations
            ? `${call.locations.city || ""}, ${call.locations.state || ""}`
            : "—";


        const search = dispatchSearchText(call, [
          technicianName(call.technicians), call.status,
          call.locations?.city, call.locations?.state
        ]);
        const html = `

          <tr>

            <td><strong>${escapeHtml(workOrderLabel(call))}</strong></td>
            <td>
              <span class="type-badge">
                ${escapeHtml(
                  workTypeLabel(call.work_type)
                )}
              </span>
            </td>

            <td>
              ${escapeHtml(
                customerName(call.customers)
              )}
            </td>

            <td title="${escapeAttribute(call.description || "")}">
              ${escapeHtml(descriptionPreview(call.description))}
            </td>
            <td>
              ${escapeHtml(location)}
            </td>

            <td>
              ${escapeHtml(scheduled)}
            </td>

            <td>
              ${escapeHtml(
                technicianName(call.technicians)
              )}
            </td>

            <td>
              <span class="status">
                ${escapeHtml(
                  statusLabel(call.status)
                )}
              </span>
            </td>

            <td>

              <span
                class="release-badge ${call.released ? "released" : "unreleased"}"
              >
                ${call.released ? "Released" : "Not Released"}

              <button

                onclick="showWorkOrderDetail('${call.id}')"

                Open

            </td>

          </tr>
        `;
        return { html, search };

    applyDispatchSearch("work-orders", "workOrdersBody");
  }

  async function loadWorkOrderRelated(id) {
    const queries = await Promise.all([
      db.from("parts").select("*").eq("service_call_id",id).order("created_at",{ascending:false}),
      db.from("service_call_notes").select("*").eq("service_call_id",id).order("created_at",{ascending:false}),
      db.from("service_call_photos").select("*").eq("service_call_id",id).order("created_at",{ascending:false})
    ]);
    const [parts,notes,photos]=queries;
    const elPart=document.getElementById("detailParts");
    const elNote=document.getElementById("detailNotes");
    const elPhoto=document.getElementById("detailPhotos");
    if (!elPart || !elNote || !elPhoto) return;
    const buttons=(kind,item)=>`<button class="row-button" onclick="show${kind}Form('${item.id}', '${id}')">Edit</button>
      <button class="danger" onclick="deleteRelatedRecord('${kind}','${item.id}','${id}')">Delete</button>`;
    const render=(el,result,headings,rows,empty)=>{
      if(result.error){el.textContent="Unable to load: "+result.error.message;return;}
      el.innerHTML=result.data.length
        ? `<div class="table-wrap"><table><thead><tr>${headings.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
        : `<span class="small-muted">${empty}</span>`;
    };
    render(elPart,parts,["Part Number","Description","Quantity","Unit Price",""],(parts.data||[]).map(p=>
      `<tr><td>${escapeHtml(p.part_number||"—")}</td><td>${escapeHtml(p.description||"—")}</td>
       <td>${escapeHtml(p.quantity??0)}</td><td>$${escapeHtml(Number(p.unit_cost||0).toFixed(2))}</td>
       <td>${buttons("Part",p)}</td></tr>`),"No parts recorded.");
    render(elNote,notes,["Note","Created",""],(notes.data||[]).map(n=>
      `<tr><td>${escapeHtml(n.note||"")}</td><td>${escapeHtml(n.created_at?new Date(n.created_at).toLocaleString():"—")}</td>
       <td>${buttons("Note",n)}</td></tr>`),"No notes recorded.");
    if(photos.error){elPhoto.textContent="Unable to load: "+photos.error.message;return;}
    const photoRows=await Promise.all((photos.data||[]).map(async p=>{
      let url="";
      if(p.file_path){
        if(/^https?:\/\//i.test(p.file_path)) url=p.file_path;
        else {
          const signed=await db.storage.from("dispatch-photos").createSignedUrl(p.file_path,3600);
          if(signed.error)console.error("Photo access:",signed.error);
          else url=signed.data.signedUrl;
        }
      }
      return `<tr><td>${url?`<a href="${escapeAttribute(url)}" target="_blank" rel="noopener noreferrer">
        <img class="photo-preview" src="${escapeAttribute(url)}" alt="${escapeAttribute(p.caption||"Photo")}"></a>`:"—"}</td>
        <td>${escapeHtml(p.caption||"—")}</td><td>${buttons("Photo",p)}</td></tr>`;
    }));
    render(elPhoto,photos,["Photo","Caption",""],photoRows,"No photos recorded.");
  }

  async function deleteRelatedRecord(kind,id,workOrderId) {
    if(!confirmDelete(`Delete this ${kind.toLowerCase()}?`))return;
    const table={Part:"parts",Note:"service_call_notes",Photo:"service_call_photos"}[kind];
    if(!table)return;
    if(kind==="Photo"){
      const {data,error}=await db.from(table).select("file_path").eq("id",id).single();
      if(error)return showMessage(error.message,true);
      if(data.file_path && !/^https?:\/\//i.test(data.file_path)){
        const {error:storageError}=await db.storage.from("dispatch-photos").remove([data.file_path]);
        if(storageError)return showMessage(storageError.message,true);
      }
    }
    const {error}=await db.from(table).delete().eq("id",id);
    if(error)return showMessage(error.message,true);
    showMessage(kind+" deleted.");
    await loadWorkOrderRelated(workOrderId);
  }

  document.getElementById("priority").value;

  document.getElementById("status").value;

  work_type:

  status:
    status,

  priority:
    priority,

  description:
    description,

  scheduled_at:
    scheduledAt
      ? new Date(
          scheduledAt
        ).toISOString()
      : null
};


let error;


if (existingId) {

  ({
    error
  } =
    await db
      .from("service_calls")
      .update(payload)
      .eq(
        "id",
        existingId
      ));

  ({
    error
  } =
    await db
      .from("service_calls")
      .insert(payload));
}


if (error) {

  console.error(error);

  showMessage(
    error.message,
    true
  );

  return;
}


showMessage(
  existingId
    ? "Work order saved."
    : "Work order created."
);


await showWorkOrders();


}

              id="phone"

              )}"
            >
          </div>

            <textarea id="notes">${escapeHtml(
              customer?.notes || ""
            )}</textarea>

          </div>

        </div>

            type="button"
            class="secondary"
            id="cancelCustomer"
          >

          </button>

          <button
            type="submit"
            class="primary"
          >
            ${customer
              ? "Save Customer"
              : "Create Customer"}
          </button>

        </div>

      </form>

    </div>

  </div>
`;

  .addEventListener(
    "click",
    showCustomers
  );

  .addEventListener(
    "submit",

      const payload = {

        first_name:
          document.getElementById("firstName")
            .value
            .trim(),

        last_name:
          document.getElementById("lastName")
            .value
            .trim(),

        company_name:

            .value
            .trim(),

        phone:
          document.getElementById("phone")
            .value
            .trim(),

        email:
          document.getElementById("email")
            .value
            .trim(),

        notes:
          document.getElementById("notes")
            .value
            .trim()
      };


      const wasEditing = Boolean(customer);
      let error;
      let savedRows = null;

      if (wasEditing) {

          error = new Error("Customer was not updated. Check your customer UPDATE policy.");

        const result = await db
          .from("customers")
          .insert(payload)

          error = new Error("Customer was not created. Check your customer INSERT policy.");
        }
      }

      if (error) {

        console.error(error);

        showMessage(
          error.message,
          true
        );

        return;
      }

      showMessage(wasEditing ? "Customer saved." : "Customer created.");

      await showCustomers();



    }
  );


}

id = null,
contextWorkOrderId = null
) {


let photo = null;


if (id) {

  const {
    data,
    error
  } = await db
    .from("service_call_photos")
    .select("*")
    .eq(
      "id",
      id
    )
    .single();


  if (error) {

    showMessage(
      error.message,
      true
    );

    return;
  }

  photo =
    data;
}


const main =
  document.getElementById(
    "mainContent"
  );


main.innerHTML = `

  <div class="page-head">

    <div>

      <h1>
        ${photo
          ? "Edit Photo"
          : "Add Photo"}
      </h1>

      <p>
        Attach a photo to a Work Order.
      </p>

    </div>

  </div>


  <div class="card">

    <div class="card-body">

      <form id="photoForm">

        <div class="form-grid">

          <div class="form-group full">

            <label for="photoWorkOrder">
              Work Order
            </label>

            <select
              id="photoWorkOrder"
              required
            >
              <option value="">
                Loading Work Orders...
              </option>
            </select>

          </div>


          <div class="form-group full">

            <label for="photoUpload">Upload Photo</label>
            <input id="photoUpload" type="file" accept="image/*">
            <div class="small-muted">Choose an image from your phone or computer (max 10 MB). Alternatively, use a URL below.</div>
            <label for="photoPath" style="margin-top:14px;">Existing Photo URL / File Path</label>

            <input
              id="photoPath"
              value="${escapeAttribute(
                photo?.file_path || ""
              )}"
              placeholder="Optional if uploading a photo"
            >

            <div class="small-muted">
              Enter the image URL or stored file path.
            </div>

          </div>


          <div class="form-group full">

            <label for="photoCaption">
              Caption
            </label>

            <input
              id="photoCaption"
              value="${escapeAttribute(
                photo?.caption || ""
              )}"
              placeholder="Describe the photo..."
            >

          </div>

        </div>


        <div class="form-actions">

          <button
            type="button"
            class="secondary"
            id="cancelPhoto"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="primary"
          >
            ${photo
              ? "Save Photo"
              : "Add Photo"}
          </button>

        </div>

      </form>

    </div>

  </div>
`;


await loadWorkOrderOptions(
  "photoWorkOrder",
  contextWorkOrderId || photo?.service_call_id || null
);


// When opened from a work order, keep the association fixed.
if (contextWorkOrderId) {
  const orderSelect = document.getElementById("photoWorkOrder");
  if (orderSelect.value !== contextWorkOrderId) {
    showMessage("The selected work order could not be loaded.", true);
    return;
  }
  orderSelect.disabled = true;
}

document.getElementById("cancelPhoto")
  .addEventListener(
    "click",
    () => contextWorkOrderId ? showWorkOrderDetail(contextWorkOrderId) : showPhotos()
  );


document.getElementById("photoForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const selectedFile = document.getElementById("photoUpload").files[0];
      let uploadedPath = document.getElementById("photoPath").value.trim();
      const workOrderId = contextWorkOrderId || document.getElementById("photoWorkOrder").value;
      if (selectedFile) {
        if (!selectedFile.type.startsWith("image/") || selectedFile.size > 10 * 1024 * 1024) {
          showMessage("Select an image smaller than 10 MB.", true);
          return;
        }
        if (!workOrderId) {
          showMessage("Select a work order before uploading.", true);
          return;
        }
        const extension = (selectedFile.name.split(".").pop() || "jpg").toLowerCase();
        const storagePath = `${workOrderId}/${crypto.randomUUID()}.${extension}`;
        const uploadResult = await db.storage.from("dispatch-photos")
          .upload(storagePath, selectedFile, { contentType: selectedFile.type, upsert: false });
        if (uploadResult.error) {
          showMessage("Photo upload failed: " + uploadResult.error.message, true);
          return;
        }
        uploadedPath = storagePath;
      }

      const payload = {

        service_call_id:
          (contextWorkOrderId || document.getElementById(
            "photoWorkOrder"
          ).value),

        file_path: uploadedPath,

        caption:
          document.getElementById(
            "photoCaption"
          ).value.trim()
      };


      if (
        !payload.service_call_id ||
        !payload.file_path
      ) {

        showMessage(
          "Work Order and photo path are required.",
          true
        );

        return;
      }


      let error;


      if (photo) {

        ({
          error
        } =
          await db
            .from("service_call_photos")
            .update(payload)
            .eq(
              "id",
              photo.id
            ));

      } else {

        ({
          error
        } =
          await db
            .from("service_call_photos")
            .insert(payload));
      }


      if (error) {

        console.error(error);

        showMessage(
          error.message,
          true
        );

        return;
      }


      showMessage(
        photo
          ? "Photo saved."
          : "Photo added."
      );


      if (contextWorkOrderId) await showWorkOrderDetail(contextWorkOrderId);
      else await showPhotos();

    }
  );


}

async function deletePhoto(id) {
  if (!confirmDelete("Permanently delete this photo and its stored image?")) return;
  const { data: photo, error: readError } = await db
    .from("service_call_photos").select("id,file_path").eq("id", id).single();
  if (readError) { showMessage(readError.message, true); return; }
  // Delete the database record first. If forbidden, do not touch Storage.
  const { data: deleted, error } = await db.from("service_call_photos")
    .delete().eq("id", id).select("id");
  if (error || !deleted?.length) {
    showMessage(error?.message || "You do not have permission to delete this photo.", true);
    return;
  }
  if (photo.file_path && !/^https?:\/\//i.test(photo.file_path)) {
    const result = await db.storage.from("dispatch-photos").remove([photo.file_path]);
    if (result.error) {
      console.error("Storage deletion:", result.error);
      showMessage("Photo record removed, but storage cleanup failed: " + result.error.message, true);
      await showPhotos();
      return;
    }
  }
  showMessage("Photo deleted.");
  await showPhotos();
}

// ============================================
// WORK ORDER OPTIONS
// ============================================

async function loadWorkOrderOptions(
elementId,
selectedId = null
) {


const select =
  document.getElementById(
    elementId
  );


const {
  data,
  error
} = await db
  .from("service_calls")
  .select(`
    id,
    work_order_number,
    work_type,
    description,
    scheduled_at,
    customers (
      first_name,
      last_name,
      company_name
    )
  `)
  .order(
    "scheduled_at",
    {
      ascending: false,
      nullsFirst: false
    }
  );


if (error) {

  console.error(error);

  select.innerHTML =
    `<option value="">
      Unable to load Work Orders
    </option>`;

  return;
}


select.innerHTML =
  `<option value="">
    Select Work Order
  </option>`;


data.forEach(call => {

  const option =
    document.createElement(
      "option"
    );


  const customer =
    customerName(
      call.customers
    );


  const date =
    call.scheduled_at
      ? new Date(
          call.scheduled_at
        ).toLocaleDateString()
      : "Unscheduled";


  option.value =
    call.id;


  option.textContent =
    `${workOrderLabel(call)} · ${workTypeLabel(call.work_type)} · ${customer} · ${date} · ${descriptionPreview(call.description, 65)}`;


  select.appendChild(
    option
  );

});


if (selectedId) {

  select.value =
    selectedId;
}


}

// ============================================
// NAVIGATION
// ============================================

function setActiveNav(page) {


document.querySelectorAll(
  ".nav-button"
)
  .forEach(button => {

    button.classList.toggle(
      "active",
      button.dataset.page === page
    );

  });


}

document.querySelectorAll(
".nav-button"
)
.forEach(button => {


  button.addEventListener(
    "click",
    async () => {

      const page =
        button.dataset.page;


      if (page === "schedule") {

        await showSchedule();

      } else if (
        page === "work-orders"
      ) {

        await showWorkOrders();

      } else if (
        page === "customers"
      ) {

        await showCustomers();

      } else if (
        page === "locations"
      ) {

        await showLocations();

      } else if (
        page === "technicians"
      ) {

        await showTechnicians();

      } else if (
        page === "parts"
      ) {

        await showParts();

      } else if (
        page === "notes"
      ) {

        await showNotes();

      } else if (
        page === "photos"
      ) {

        await showPhotos();

      }

    }
  );

});

document.getElementById(
"signOutButton"
)
.addEventListener(
"click",
async () => {

    await db.auth.signOut();

    window.location.href =
      "login.html";

  }
);

// START
// ============================================

async function startApp() {


const loggedIn =
  await requireLogin();

if (!loggedIn) {
  return;
}


const profileLoaded =
  await loadUserProfile();

if (!profileLoaded) {
  return;
}


await showSchedule();


}

startApp();

</script>
