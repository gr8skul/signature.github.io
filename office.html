<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signature | Ticket Workspace Prototype</title><style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f4f5f7;
      --surface: #ffffff;
      --border: #dfe2e6;
      --text: #202326;
      --muted: #6b7075;
      --accent: #222;
      --danger: #a52a2a;
      --success: #356b45;
      --warning: #8a641f;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      height: 68px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-section {
      color: var(--muted);
      font-size: 14px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
    }

    .user-role {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .sign-out {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      color: var(--text);
    }

    .sign-out:hover {
      background: #f0f1f2;
    }

    .app {
      display: flex;
      min-height: calc(100vh - 68px);
    }

    nav {
      width: 220px;
      background: #fafafa;
      border-right: 1px solid var(--border);
      padding: 22px 14px;
      flex-shrink: 0;
    }

    .nav-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 4px 10px 10px;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      padding: 11px 10px;
      margin-bottom: 3px;
      color: var(--text);
    }

    .nav-button:hover,
    .nav-button.active {
      background: #e9eaec;
    }

    main {
      flex: 1;
      padding: 30px;
      max-width: 1500px;
      width: 100%;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .primary {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      font-weight: 600;
    }

    .primary:hover {
      background: #000;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .card-body {
      padding: 18px;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-controls button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 11px;
    }

    .date-controls strong {
      min-width: 190px;
      text-align: center;
      font-size: 15px;
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 18px;
      padding: 17px 18px;
      border-bottom: 1px solid #eceef0;
      align-items: center;
    }

    .schedule-item:last-child {
      border-bottom: 0;
    }

    .schedule-time {
      font-size: 14px;
      font-weight: 600;
    }

    .schedule-description {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .schedule-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status,
    .type-badge,
    .release-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status {
      background: #eceef0;
      text-transform: capitalize;
    }

    .type-badge {
      background: #f0f1f2;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-right: 5px;
    }

    .release-badge {
      background: #f0f1f2;
    }

    .release-badge.released {
      background: #e5efe7;
      color: var(--success);
    }

    .release-badge.unreleased {
      background: #f3eee3;
      color: var(--warning);
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #eceef0;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .sort-heading { background: transparent; border: 0; padding: 0; color: inherit; font: inherit; font-weight: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; white-space: nowrap; }
    .sort-heading:hover { color: #202326; text-decoration: underline; }
    .sort-heading:focus-visible { outline: 2px solid #202326; outline-offset: 4px; }

    tr:last-child td {
      border-bottom: 0;
    }

    .row-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .row-button:hover {
      background: #f0f1f2;
    }

    .filter-bar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .filter-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 11px;
      font-size: 12px;
    }

    .filter-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .dispatch-search {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .dispatch-search label { display:block; margin-bottom:7px; }
    .dispatch-search input { max-width: 680px; }
    .dispatch-search .small-muted { margin-top: 7px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd3d7;
      border-radius: 5px;
      padding: 10px 11px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 28px;
    }

    .checkbox-row input {
      width: auto;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

    .secondary {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 15px;
    }

    .secondary:hover {
      background: #f0f1f2;
    }

    .danger {
      background: white;
      color: var(--danger);
      border: 1px solid #d9b5b5;
      border-radius: 5px;
      padding: 10px 15px;
    }

    .danger:hover {
      background: #faf0f0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .detail-item {
      border-bottom: 1px solid #eceef0;
      padding-bottom: 12px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
    }

    .small-muted {
      color: var(--muted);
      font-size: 12px;
    }

    .photo-preview {
      max-width: 180px;
      max-height: 120px;
      border-radius: 5px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    #message {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #222;
      color: white;
      padding: 13px 17px;
      border-radius: 6px;
      display: none;
      z-index: 50;
      font-size: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
      max-width: 420px;
    }

    #message.error {
      background: var(--danger);
    }

    @media (max-width: 800px) {
      header {
        padding: 0 16px;
      }

      .brand-section,
      .user-role {
        display: none;
      }

      nav {
        width: 175px;
      }

      main {
        padding: 20px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .schedule-item {
        grid-template-columns: 70px 1fr;
      }

      .schedule-item .schedule-actions {
        grid-column: 2;
      }

      .form-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .app {
        display: block;
      }

      nav {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        overflow-x: auto;
        padding: 8px;
      }

      .nav-label {
        display: none;
      }

      .nav-button {
        width: auto;
        white-space: nowrap;
        margin: 0;
      }

      main {
        padding: 16px;
      }

      .schedule-item {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .schedule-item .schedule-actions {
        grid-column: auto;
      }

      .date-controls strong {
        min-width: 0;
      }
    }
    .office-intake { max-width: 950px; }
    .office-intake .card { overflow:visible; }
    .office-intake .form-grid { align-items:start; }
    .office-intake .suggestions { border:1px solid var(--border); border-radius:5px; max-height:225px; overflow-y:auto; background:white; margin-top:4px; }
    .office-intake .suggestion { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--border); background:white; padding:10px 12px; }
    .office-intake .suggestion:hover, .office-intake .suggestion:focus { background:#edf0f3; }
    .office-intake .subtle-panel { background:#fafafa; border:1px solid var(--border); border-radius:6px; padding:16px; margin-top:10px; }
    .office-intake .form-grid { gap:12px; }
    .office-intake textarea { min-height:125px; }
  
.demo{background:#fff4dc;padding:10px 24px;border-bottom:1px solid #e6d5a7;font-size:13px}.ticket-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.side-panel{background:white;border:1px solid var(--border);border-radius:8px;padding:14px;align-self:start}.side-panel button{display:block;width:100%;text-align:left;padding:10px;margin:3px 0;border:0;border-radius:5px;background:transparent}.side-panel button.active{background:#e9eaec;font-weight:bold}.pill{background:#edf0f4;border-radius:20px;padding:5px 10px;font-size:12px;display:inline-block}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.metric{background:white;border:1px solid var(--border);padding:15px;border-radius:8px;min-width:145px}.metric b{display:block;font-size:25px}.ticket-row{cursor:pointer}.ticket-row:hover{background:#f5f6f7}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar input{max-width:380px}.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.timeline{border-left:2px solid #dfe2e6;margin-left:8px;padding-left:20px}.event{position:relative;margin:0 0 20px}.event:before{content:'';position:absolute;left:-26px;top:4px;background:#555;width:10px;height:10px;border-radius:50%}.event small{color:#6b7075}.muted{color:#6b7075}.stack{display:grid;gap:14px}.hidden{display:none!important}@media(max-width:850px){.ticket-layout{grid-template-columns:1fr}.side-panel{display:flex;flex-wrap:wrap;gap:4px}.side-panel button{width:auto}main{padding:15px}}
</style></head><body><header><div class="brand"><div class="brand-name">SIGNATURE</div><div class="brand-section">TICKET WORKSPACE</div></div><div class="user-area"><span class="small-muted">Workflow design preview</span><button class="sign-out" id="reset">Reset demo</button></div></header><div class="demo"><strong>Prototype only.</strong> Sample data is stored in this browser. No Supabase connection, no changes to your live Office or Work Orders.</div><main style="max-width:1500px;margin:auto"><div class="page-head"><div><h1 id="pageTitle">Tickets</h1><p>One customer need · One continuous record · One accountable process</p></div><button class="primary" id="newTicket">+ New Ticket</button></div><div class="ticket-layout"><aside class="side-panel" id="views"></aside><section id="content"></section></div></main><div id="message"></div><script>
const DESIGNATIONS={"Service Intake":{stage:"Intake",department:"Office",classification:"Service"},"Sales Intake":{stage:"Intake",department:"Sales",classification:"Sales"},"Service Work Order":{stage:"Field Work",department:"Dispatch",classification:"Service"},"Check-Out Work Order":{stage:"Field Work",department:"Dispatch",classification:"Check-Out"},"Check-Out Prospect":{stage:"Sales Follow-Up",department:"Sales",classification:"Check-Out"},"Quote":{stage:"Estimating",department:"Sales",classification:"Quote"},"Approved":{stage:"Approved / Planning",department:"Dispatch",classification:"Installation"},"Install Work Order":{stage:"Field Work",department:"Dispatch",classification:"Installation"},"Completed":{stage:"Closed",department:"Archive",classification:"Completed"},"Cancelled":{stage:"Closed",department:"Archive",classification:"Cancelled"}};
const seed=[{id:1,customer:"Harrison Manufacturing",contact:"M. Harrison",phone:"555-0101",address:"410 Industrial Way",description:"Overhead door sticks halfway open",origin:"Service Intake",designation:"Service Work Order",assignee:"Boonville Crew",priority:"Normal",scheduled:"2026-10-26T09:00",history:[{from:null,to:"Service Intake",at:"2026-10-22T08:00",by:"Office",note:"Customer requested service"},{from:"Service Intake",to:"Service Work Order",at:"2026-10-22T08:15",by:"Office",note:"Ready for dispatch"}],notes:[]},{id:2,customer:"Dawson Properties",contact:"",phone:"555-0102",address:"89 Oak Street",description:"Assess old garage door for replacement",origin:"Service Intake",designation:"Check-Out Prospect",assignee:"Kendrick",priority:"Normal",scheduled:"",history:[{from:null,to:"Service Intake",at:"2026-10-20T09:00",by:"Office",note:"Original request"},{from:"Service Intake",to:"Check-Out Work Order",at:"2026-10-20T09:10",by:"Dispatch",note:"Site visit"},{from:"Check-Out Work Order",to:"Check-Out Prospect",at:"2026-10-21T15:30",by:"Technician",note:"Replacement recommended; sales follow-up"}],notes:[]},{id:3,customer:"Miller Residence",contact:"",phone:"555-0103",address:"14 Pine Lane",description:"New two-car garage door installation",origin:"Sales Intake",designation:"Quote",assignee:"Kendrick",priority:"High",scheduled:"",history:[{from:null,to:"Sales Intake",at:"2026-10-22T10:00",by:"Office",note:"New inquiry"},{from:"Sales Intake",to:"Quote",at:"2026-10-22T13:00",by:"Sales",note:"Preparing estimate"}],notes:[]}];
const key="signature_ticket_design_preview_v1";let tickets;try{tickets=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch(e){tickets=structuredClone(seed)}let view="All Tickets",selected=null,search="";const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(tickets));const fmt=d=>d?new Date(d).toLocaleString():"—";const code=t=>"T-"+String(t.id).padStart(6,"0");const opt=(values,selected)=>values.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('');
function renderViews(){let groups=["All Tickets","Office","Dispatch","Sales","Archive","Unassigned"];$("views").innerHTML='<div class="nav-label">Shared workspace</div>'+groups.map(v=>`<button class="${view===v?'active':''}" data-view="${v}">${v} <span class="muted">${tickets.filter(t=>matchesView(t,v)).length}</span></button>`).join('')+'<hr><div class="small-muted" style="padding:8px">Department views are automatic. The current designation determines routing; the assigned person is independent.</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;render()})}
function matchesView(t,v){let d=DESIGNATIONS[t.designation];return v==='All Tickets'||(v==='Unassigned'?!t.assignee:d.department===v)}
function render(){renderViews();$("pageTitle").textContent=selected?'Ticket '+code(tickets.find(t=>t.id===selected)||{id:selected}):'Tickets';if(selected){detail();return}let rows=tickets.filter(t=>matchesView(t,view)&&[code(t),t.customer,t.description,t.designation,t.assignee,t.address].join(' ').toLowerCase().includes(search.toLowerCase()));$("content").innerHTML=`<div class="metrics"><div class="metric"><b>${tickets.length}</b><span class="muted">Total Tickets</span></div><div class="metric"><b>${tickets.filter(t=>DESIGNATIONS[t.designation].department==='Dispatch').length}</b><span class="muted">Dispatch</span></div><div class="metric"><b>${tickets.filter(t=>DESIGNATIONS[t.designation].department==='Sales').length}</b><span class="muted">Sales</span></div><div class="metric"><b>${tickets.filter(t=>!t.assignee).length}</b><span class="muted">Unassigned</span></div></div><div class="card"><div class="card-head"><h2>${esc(view)}</h2><span class="small-muted">${rows.length} tickets</span></div><div class="dispatch-search"><input id="search" placeholder="Search number, customer, designation, description…" value="${esc(search)}"></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Customer / Request</th><th>Current designation</th><th>Routed to</th><th>Assigned to</th><th>Priority</th></tr></thead><tbody>${rows.map(t=>`<tr class="ticket-row" data-id="${t.id}"><td><strong>${code(t)}</strong></td><td><strong>${esc(t.customer)}</strong><div class="small-muted">${esc(t.description)}</div></td><td><span class="pill">${esc(t.designation)}</span></td><td>${esc(DESIGNATIONS[t.designation].department)}</td><td>${esc(t.assignee||'Unassigned')}</td><td>${esc(t.priority)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching tickets</td></tr>'}</tbody></table></div></div>`;$("search").oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$("search").focus();$("search").setSelectionRange(pos,pos)};document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>{selected=Number(r.dataset.id);render()})}
function detail(){let t=tickets.find(t=>t.id===selected);if(!t){selected=null;render();return}let d=DESIGNATIONS[t.designation];$("content").innerHTML=`<button class="secondary" id="back">← Tickets</button><div class="card" style="margin-top:15px"><div class="card-head ticket-top"><div><h2>${code(t)} · ${esc(t.customer)}</h2><span class="pill">${esc(t.designation)}</span></div><span class="small-muted">Original intake: ${esc(t.origin)}</span></div><div class="card-body"><div class="detail-grid"><div><div class="detail-label">Customer request (original)</div><strong>${esc(t.description)}</strong></div><div><div class="detail-label">Service location</div>${esc(t.address||'Not provided')}</div><div><div class="detail-label">Contact / phone</div>${esc(t.contact||'—')} · ${esc(t.phone||'—')}</div><div><div class="detail-label">Scheduled</div>${esc(t.scheduled?fmt(t.scheduled):'Not scheduled')}</div></div></div></div><div class="card"><div class="card-head"><h2>Current workflow</h2></div><div class="card-body"><div class="form-grid"><div class="form-group"><label>Current designation</label><select id="designation">${opt(Object.keys(DESIGNATIONS),t.designation)}</select></div><div class="form-group"><label>Assigned to (independent of designation)</label><input id="assignee" value="${esc(t.assignee)}" placeholder="Person or crew"></div><div class="form-group"><label>Priority</label><select id="priority">${opt(['Low','Normal','High','Urgent'],t.priority)}</select></div><div class="form-group"><label>Schedule (optional)</label><input type="datetime-local" id="scheduled" value="${esc(t.scheduled)}"></div><div class="form-group full"><label>Reason / handoff note</label><textarea id="reason" placeholder="Why is this designation changing? What should the next department know?"></textarea></div></div><div class="subtle-panel" style="margin-top:15px;background:#f8f9fa;padding:14px;border:1px solid #ddd"><strong>Routing preview</strong><div id="routing" class="small-muted"></div></div><div class="form-actions"><button class="primary" id="update">Save Ticket</button></div></div></div><div class="card"><div class="card-head"><h2>Complete designation history</h2></div><div class="card-body timeline">${[...t.history].reverse().map(h=>`<div class="event"><strong>${esc(h.from? h.from+' → '+h.to:h.to)}</strong><div class="small-muted">${esc(fmt(h.at))} · ${esc(h.by)}</div><div>${esc(h.note||'No note')}</div></div>`).join('')}</div></div><div class="card"><div class="card-head"><h2>Ticket notes</h2></div><div class="card-body"><div class="stack">${(t.notes||[]).map(n=>`<div><strong>${esc(n.by)}</strong> <span class="small-muted">${esc(fmt(n.at))}</span><div>${esc(n.text)}</div></div>`).join('')||'<div class="small-muted">No notes yet.</div>'}<textarea id="newNote" placeholder="Add an ongoing note to this Ticket"></textarea><button class="secondary" id="addNote">Add Note</button></div></div></div>`;$("back").onclick=()=>{selected=null;render()};const route=()=>{let x=DESIGNATIONS[$("designation").value];$("routing").textContent=`Department: ${x.department} · Stage: ${x.stage} · Classification: ${x.classification}. Ticket number and original request remain unchanged.`};$("designation").onchange=route;route();$("update").onclick=()=>{let next=$("designation").value,reason=$("reason").value.trim();if(next!==t.designation&&!reason){alert('Please record a reason for changing the designation.');return}if(next!==t.designation){t.history.push({from:t.designation,to:next,at:new Date().toISOString(),by:'Office (prototype)',note:reason});t.designation=next}t.assignee=$("assignee").value.trim();t.priority=$("priority").value;t.scheduled=$("scheduled").value;save();render()};$("addNote").onclick=()=>{let text=$("newNote").value.trim();if(!text)return;(t.notes??=[]).push({by:'Office (prototype)',at:new Date().toISOString(),text});save();render()}}
function intake(){$("pageTitle").textContent='New Ticket';$("content").innerHTML=`<div class="card"><div class="card-head"><h2>Customer intake</h2></div><div class="card-body"><form id="intake" class="stack"><div class="form-grid"><div class="form-group"><label>Customer / Company</label><input name="customer" required></div><div class="form-group"><label>Contact</label><input name="contact"></div><div class="form-group"><label>Phone</label><input name="phone"></div><div class="form-group"><label>Service Address</label><input name="address"></div><div class="form-group"><label>Intake designation</label><select name="origin">${opt(['Service Intake','Sales Intake'],'Service Intake')}</select></div><div class="form-group"><label>Priority</label><select name="priority">${opt(['Low','Normal','High','Urgent'],'Normal')}</select></div><div class="form-group full"><label>Original customer request</label><textarea name="description" required></textarea></div></div><p class="small-muted">The ticket starts in intake and is routed automatically. It may later become a Work Order, Prospect, Quote, or Installation without changing its ID.</p><div class="form-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" class="primary">Create Ticket</button></div></form></div></div>`;$("cancel").onclick=()=>render();$("intake").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),origin=f.get('origin');let t={id:Math.max(0,...tickets.map(x=>x.id))+1,customer:f.get('customer').trim(),contact:f.get('contact').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),description:f.get('description').trim(),origin,designation:origin,priority:f.get('priority'),assignee:'',scheduled:'',notes:[],history:[{from:null,to:origin,at:new Date().toISOString(),by:'Office (prototype)',note:'Original customer intake'}]};tickets.unshift(t);save();selected=t.id;render()}}
$("newTicket").onclick=()=>{selected=null;intake()};$("reset").onclick=()=>{if(confirm('Reset all prototype tickets to the original examples?')){tickets=structuredClone(seed);save();selected=null;search='';view='All Tickets';render()}};render();
</script></body></html>
